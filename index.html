function updatePeriodPanel(fg){
  const panel = document.getElementById('periodoPanel');
  if(!panel) return;
  const deEl = document.getElementById('periodoDe'), ateEl = document.getElementById('periodoAte');
  if(!deEl || !ateEl) return;
  let de = Math.max(1, Math.round(parseNumberBR(deEl.value)) || 1);
  let ate = Math.min(fg.maxMes, Math.round(parseNumberBR(ateEl.value)) || fg.maxMes);
  if(ate < de) [de, ate] = [ate, de];
  const linhas = fg.linhas.filter(l => l.mes >= de && l.mes <= ate);
  const creditos = linhas.reduce((s,l)=>s+l.creditosTotal,0);
  const jurosPeriodo = linhas.reduce((s,l)=>s+l.jurosMes,0);
  const debitos = linhas.reduce((s,l)=>s+l.debitoMes,0);
  const saldoPeriodo = creditos - debitos;
  const saldoAcumFinal = linhas.length ? linhas[linhas.length-1].saldoAcum : 0;
  const margemPeriodo = creditos > 0 ? (saldoPeriodo/creditos*100) : 0;
  panel.innerHTML = periodPanelHTML(de, ate, creditos, jurosPeriodo, debitos, saldoPeriodo, saldoAcumFinal, margemPeriodo);
}

function buildSemesterBuckets(fg){
  const buckets = [];
  for(let start = 1; start <= fg.maxMes; start += 6){
    const end = Math.min(fg.maxMes, start + 5);
    const linhas = fg.linhas.filter(l => l.mes >= start && l.mes <= end);
    const receitas = linhas.reduce((s,l) => s + l.creditosTotal, 0);
    const despesas = linhas.reduce((s,l) => s + l.debitoMes, 0);
    buckets.push({ label: `M${start}-${end}`, receitas, despesas });
  }
  return buckets;
}

function drawViabilidadeCharts(fg){
  try{
    drawHBarChart('chartReceitaEtapa', fg.etapasCalc.map(x=>x.etapa.nome), fg.etapasCalc.map(x=>x.calc.totalRecebido), CV.green);
  } catch(e){ console.error('Erro no gráfico Receita por Etapa:', e); }

  try{
    const palette = ['#B0402E','#B8862E','#3B6E8F','#7A5DA6','#3B8F6E','#0E1B2A'];
    drawDoughnutChart('chartCustoCategoria', fg.despesas.porCategoria.map(p=>p.categoria.nome), fg.despesas.porCategoria.map(p=>p.total), palette);
  } catch(e){ console.error('Erro no gráfico Custos por Categoria:', e); }

  try{
    const buckets = buildSemesterBuckets(fg);
    const wrap = document.getElementById('chartReceitaDespesaWrap');
    if(wrap){
      const minGroupWidth = 92;
      const scrollParentWidth = wrap.parentElement.clientWidth;
      wrap.style.width = Math.max(scrollParentWidth, buckets.length * minGroupWidth) + 'px';
    }
    drawGroupedBarChart('chartReceitaDespesa', buckets, { colorA:'#2F6FED', colorB:'#D94F45' });
  } catch(e){ console.error('Erro no gráfico Receitas x Despesas:', e); }
}

/* =========================================================================
   EVENTOS — delegação central. Qualquer alteração → recalcula e re-renderiza.
   ========================================================================= */
function setPath(obj, path, value){
  const parts = path.split('.');
  let cur = obj;
  for(let i=0;i<parts.length-1;i++) cur = cur[parts[i]];
  cur[parts[parts.length-1]] = value;
}
function getTipo(tipoId){
  for(const e of state.etapas) for(const t of e.tipos) if(t.id===tipoId) return t;
}
function getEtapaOfTipo(tipoId){
  for(const e of state.etapas) for(const t of e.tipos) if(t.id===tipoId) return e;
}

function attachEvents(fg){
  const main = document.getElementById('main');

  // formatação BR (1.000, 1.234,5) enquanto digita — não interfere no parse
  attachNumberFormatting(main);

  // inputs de texto/numero: usamos 'change' pra não re-renderizar a cada tecla (perde foco)
  main.querySelectorAll('[data-act]').forEach(el => {
    const act = el.dataset.act;
    const evt = (el.tagName==='SELECT') ? 'change' : (el.tagName==='INPUT' ? 'change' : 'click');
    if(el.dataset.bound) return;
    el.dataset.bound = "1";
    el.addEventListener(evt, () => handleAction(act, el));
  });

  document.getElementById('btnAddEtapa')?.addEventListener('click', () => {
    pushUndo();
    state.etapas.push(novaEtapa("Etapa " + (state.etapas.length+1)));
    renderAll();
  });
  document.getElementById('btnAddCategoria')?.addEventListener('click', () => {
    pushUndo();
    state.despesaCategorias.push({ id: uid("cat"), nome: "Nova Categoria", despesas: [] });
    renderAll();
  });

  // explorador mensal (Resumo Geral) — desliza sem re-renderizar a página inteira
  const slider = document.getElementById('monthSlider');
  if(slider){
    updateMonthPanel(fg, parseInt(slider.value));
    slider.addEventListener('input', () => updateMonthPanel(fg, parseInt(slider.value)));
  }
  const btnPeriodo = document.getElementById('btnVerPeriodo');
  if(btnPeriodo){
    updatePeriodPanel(fg);
    btnPeriodo.addEventListener('click', () => updatePeriodPanel(fg));
  }
}

// ações que alteram dado (etapas/tipos/despesas) e por isso entram no histórico de desfazer.
// abrir/fechar um tipo (toggle-tipo) e as exclusões com confirmação (que empilham o undo só se
// o usuário de fato confirmar, dentro do próprio showConfirm) ficam de fora desta lista.
const MUTATING_ACTIONS = new Set([
  'etapa-nome','add-tipo','dup-tipo','tipo-field','pag-field','ic-field',
  'add-intercalada','del-intercalada','auto-fix','cat-nome','add-desp','del-desp','desp-field',
  'desp-modo','add-parcela','del-parcela','parcela-field'
]);

function handleAction(act, el){
  if(MUTATING_ACTIONS.has(act)) pushUndo();
  switch(act){
    case 'etapa-nome': {
      const e = state.etapas.find(x=>x.id===el.dataset.etapa);
      e.nome = el.value; renderAll(); break;
    }
    case 'del-etapa': {
      const e = state.etapas.find(x=>x.id===el.dataset.etapa);
      showConfirm(`Excluir a etapa "${e.nome}" e ${e.tipos.length===1 ? 'seu único tipo' : 'todos os seus '+e.tipos.length+' tipos'}? Dá pra desfazer depois com Ctrl+Z ou o botão ↶.`, () => {
        pushUndo();
        state.etapas = state.etapas.filter(x=>x.id!==el.dataset.etapa);
        renderAll();
      });
      break;
    }
    case 'add-tipo': {
      const e = state.etapas.find(x=>x.id===el.dataset.etapa);
      e.tipos.push(novoTipo('Tipo ' + (e.tipos.length+1)));
      renderAll(); break;
    }
    case 'dup-tipo': {
      const e = state.etapas.find(x=>x.id===el.dataset.etapa);
      const t = e.tipos.find(x=>x.id===el.dataset.tipo);
      const clone = JSON.parse(JSON.stringify(t));
      clone.id = uid("tipo"); clone.nome = t.nome + " (cópia)";
      clone.pagamento.intercaladas.forEach(ic=>ic.id=uid("int"));
      e.tipos.push(clone); renderAll(); break;
    }
    case 'del-tipo': {
      const e = state.etapas.find(x=>x.id===el.dataset.etapa);
      const t = e.tipos.find(x=>x.id===el.dataset.tipo);
      showConfirm(`Excluir o tipo "${t.nome}" (${e.nome})? Dá pra desfazer depois com Ctrl+Z ou o botão ↶.`, () => {
        pushUndo();
        e.tipos = e.tipos.filter(x=>x.id!==el.dataset.tipo);
        renderAll();
      });
      break;
    }
    case 'toggle-tipo': {
      const id = el.dataset.tipo;
      state.ui.openTipos[id] = !state.ui.openTipos[id];
      renderAll(); break;
    }
    case 'tipo-field': {
      const t = getTipo(el.dataset.tipo);
      const field = el.dataset.field;
      t[field] = el.classList.contains('num-input') ? parseNumberBR(el.value) : el.value;
      renderAll(); break;
    }
    case 'pag-field': {
      const t = getTipo(el.dataset.tipo);
      let val = el.value;
      if(el.dataset.bool) val = (val === 'true');
      else if(el.classList.contains('pct-input')) val = parsePercent(val);
      else if(el.classList.contains('num-input')) val = parseNumberBR(val);
      setPath(t.pagamento, el.dataset.path, val);
      renderAll(); break;
    }
    case 'ic-field': {
      const t = getTipo(el.dataset.tipo);
      const ic = t.pagamento.intercaladas.find(x=>x.id===el.dataset.ic);
      const field = el.dataset.field;
      let val = el.value;
      if(el.dataset.bool) val = (val === 'true');
      else if(el.classList.contains('pct-input')) val = parsePercent(val);
      else if(el.classList.contains('num-input')) val = parseNumberBR(val);
      ic[field] = val;
      renderAll(); break;
    }
    case 'add-intercalada': {
      const t = getTipo(el.dataset.tipo);
      t.pagamento.intercaladas.push({ id: uid("int"), nome: "Intercalada " + (t.pagamento.intercaladas.length+1),
        valor: 5000, qtd: 1, mesInicio: t.mesEntrega||12, periodicidade: "semestral", jurosAtivo: false, jurosTaxa: 0 });
      renderAll(); break;
    }
    case 'del-intercalada': {
      const t = getTipo(el.dataset.tipo);
      t.pagamento.intercaladas = t.pagamento.intercaladas.filter(x=>x.id!==el.dataset.ic);
      renderAll(); break;
    }
    case 'auto-fix': {
      // zera a diferença no destino escolhido pelo usuário (entrada / mensais1 / intercalada X / mensais2)
      // f.diferenca já é por unidade (mesma escala do Preço Alvo), não precisa dividir por quantidade
      const t = getTipo(el.dataset.tipo);
      const f = calcFluxoTipo(t);
      const sel = document.querySelector(`select.zero-target-select[data-tipo-select="${t.id}"]`);
      const target = sel ? sel.value : 'mensais2';
      const diferenca = f.diferenca;

      if(target === 'entrada'){
        const qtd = Math.max(1, t.pagamento.entrada.qtd|0);
        t.pagamento.entrada.valor += diferenca / qtd;
      } else if(target === 'mensais1'){
        const qtd = f.mensais1Info.qtd;
        if(qtd > 0) t.pagamento.mensais1.valor += diferenca / qtd;
      } else if(target.startsWith('ic:')){
        const icId = target.slice(3);
        const ic = t.pagamento.intercaladas.find(x=>x.id===icId);
        if(ic && ic.qtd > 0) ic.valor += diferenca / ic.qtd;
      } else if(target === 'mensais2'){
        if(t.pagamento.mensais2.qtd > 0) t.pagamento.mensais2.valor += diferenca / t.pagamento.mensais2.qtd;
      }
      renderAll(); break;
    }
    case 'cat-nome': {
      const c = state.despesaCategorias.find(x=>x.id===el.dataset.cat);
      c.nome = el.value; renderAll(); break;
    }
    case 'del-cat': {
      const c = state.despesaCategorias.find(x=>x.id===el.dataset.cat);
      showConfirm(`Excluir a categoria "${c.nome}" e ${c.despesas.length===0 ? 'nenhuma despesa' : 'todas as '+c.despesas.length+' despesas'} dentro dela? Dá pra desfazer depois com Ctrl+Z ou o botão ↶.`, () => {
        pushUndo();
        state.despesaCategorias = state.despesaCategorias.filter(x=>x.id!==el.dataset.cat);
        renderAll();
      });
      break;
    }
    case 'add-desp': {
      const c = state.despesaCategorias.find(x=>x.id===el.dataset.cat);
      c.despesas.push({ id: uid("desp"), nome: "Nova despesa", modo: "linear", valor: 100000, mesInicio: 1, mesFim: 6 });
      renderAll(); break;
    }
    case 'del-desp': {
      const c = state.despesaCategorias.find(x=>x.id===el.dataset.cat);
      c.despesas = c.despesas.filter(x=>x.id!==el.dataset.desp);
      renderAll(); break;
    }
    case 'desp-field': {
      const c = state.despesaCategorias.find(x=>x.id===el.dataset.cat);
      const d = c.despesas.find(x=>x.id===el.dataset.desp);
      const field = el.dataset.field;
      d[field] = el.classList.contains('num-input') ? parseNumberBR(el.value) : el.value;
      renderAll(); break;
    }
    case 'desp-modo': {
      // troca entre distribuição linear e parcelas por data (ex: terreno dividido entre vários investidores)
      const c = state.despesaCategorias.find(x=>x.id===el.dataset.cat);
      const d = c.despesas.find(x=>x.id===el.dataset.desp);
      d.modo = el.value;
      if(d.modo === 'parcelas' && (!d.parcelas || d.parcelas.length===0)){
        // semeia com uma parcela usando o valor/mês atual, pra não perder o que já tinha sido preenchido
        d.parcelas = [{ id: uid('parc'), nome: 'Investidor 1', valor: Number(d.valor)||0, mes: Number(d.mesInicio)||1 }];
      }
      renderAll(); break;
    }
    case 'add-parcela': {
      const c = state.despesaCategorias.find(x=>x.id===el.dataset.cat);
      const d = c.despesas.find(x=>x.id===el.dataset.desp);
      d.parcelas = d.parcelas || [];
      d.parcelas.push({ id: uid('parc'), nome: 'Investidor ' + (d.parcelas.length+1), valor: 0, mes: (d.mesInicio||1) });
      renderAll(); break;
    }
    case 'del-parcela': {
      const c = state.despesaCategorias.find(x=>x.id===el.dataset.cat);
      const d = c.despesas.find(x=>x.id===el.dataset.desp);
      d.parcelas = (d.parcelas||[]).filter(x=>x.id!==el.dataset.parc);
      renderAll(); break;
    }
    case 'parcela-field': {
      const c = state.despesaCategorias.find(x=>x.id===el.dataset.cat);
      const d = c.despesas.find(x=>x.id===el.dataset.desp);
      const pc = (d.parcelas||[]).find(x=>x.id===el.dataset.parc);
      const field = el.dataset.field;
      pc[field] = el.classList.contains('num-input') ? parseNumberBR(el.value) : el.value;
      renderAll(); break;
    }
  }
}

/* =========================================================================
   CALCULADORA FLUTUANTE — independente do ciclo de render das telas
   ========================================================================= */
const calcState = { display: '0', prev: null, op: null, resetNext: false };

function calcRender(){
  const el = document.getElementById('calcDisplay');
  if(el) el.textContent = calcState.display;
}
function calcPressDigit(d){
  if(calcState.resetNext){ calcState.display = '0'; calcState.resetNext = false; }
  if(d === ','){
    if(calcState.display.includes(',')) return;
    calcState.display += ',';
  } else {
    calcState.display = (calcState.display === '0') ? d : calcState.display + d;
  }
  calcRender();
}
function calcPressOp(op){
  if(calcState.op && !calcState.resetNext) calcCompute();
  calcState.prev = parseFloat(calcState.display.replace(',', '.'));
  calcState.op = op;
  calcState.resetNext = true;
}
function calcCompute(){
  if(calcState.op == null || calcState.prev == null) return;
  const cur = parseFloat(calcState.display.replace(',', '.'));
  let result = cur;
  switch(calcState.op){
    case '+': result = calcState.prev + cur; break;
    case '-': result = calcState.prev - cur; break;
    case '*': result = calcState.prev * cur; break;
    case '/': result = cur !== 0 ? calcState.prev / cur : 0; break;
  }
  result = Math.round(result * 1e6) / 1e6;
  calcState.display = String(result).replace('.', ',');
  calcState.op = null; calcState.prev = null; calcState.resetNext = true;
  calcRender();
}
function calcClear(){
  calcState.display = '0'; calcState.prev = null; calcState.op = null; calcState.resetNext = false;
  calcRender();
}
function calcToggleSign(){
  calcState.display = String(parseFloat(calcState.display.replace(',', '.')) * -1).replace('.', ',');
  calcRender();
}
function calcPercent(){
  calcState.display = String(parseFloat(calcState.display.replace(',', '.')) / 100).replace('.', ',');
  calcRender();
}
function initCalculator(){
  document.getElementById('btnCalc')?.addEventListener('click', () => {
    document.getElementById('calcOverlay').classList.toggle('open');
  });
  document.getElementById('calcClose')?.addEventListener('click', () => {
    document.getElementById('calcOverlay').classList.remove('open');
  });
  document.querySelectorAll('.calc-grid button').forEach(btn => {
    btn.addEventListener('click', () => {
      const c = btn.dataset.c;
      if(c === 'C') calcClear();
      else if(c === '=') calcCompute();
      else if(c === '±') calcToggleSign();
      else if(c === '%') calcPercent();
      else if(['+','-','*','/'].includes(c)) calcPressOp(c);
      else calcPressDigit(c);
    });
  });
}
initCalculator();

/* =========================================================================
   SIMULAÇÕES — salvar/abrir cenários. Ordem de prioridade:
   1) window.storage (dentro do Claude.ai, persiste entre sessões)
   2) localStorage (hospedado num domínio de verdade, ex: Netlify — persiste entre sessões)
   3) memória (aberto local via file://, persiste só durante a aba aberta)
   ========================================================================= */
let simMemoryStore = {};

function lsAvailable(){
  try{ localStorage.setItem('__ls_test__','1'); localStorage.removeItem('__ls_test__'); return true; }
  catch(e){ return false; }
}

async function simSet(name, data){
  try{
    if(window.storage){ await window.storage.set('sim:' + name, JSON.stringify(data)); return true; }
  } catch(e){ console.error('storage.set falhou:', e); }
  try{
    if(lsAvailable()){ localStorage.setItem('sim:' + name, JSON.stringify(data)); return true; }
  } catch(e){ console.error('localStorage.set falhou:', e); }
  simMemoryStore[name] = data;
  return true;
}
async function simGetAll(){
  try{
    if(window.storage){
      const list = await window.storage.list('sim:');
      const out = {};
      const keys = (list && list.keys) || [];
      for(const k of keys){
        const keyName = typeof k === 'string' ? k : (k.key || '');
        try{
          const r = await window.storage.get(keyName);
          if(r && r.value) out[keyName.slice(4)] = JSON.parse(r.value);
        } catch(e){}
      }
      return out;
    }
  } catch(e){ console.error('storage.list falhou:', e); }
  try{
    if(lsAvailable()){
      const out = {};
      for(let i = 0; i < localStorage.length; i++){
        const k = localStorage.key(i);
        if(k && k.startsWith('sim:')){
          try{ out[k.slice(4)] = JSON.parse(localStorage.getItem(k)); } catch(e){}
        }
      }
      return out;
    }
  } catch(e){ console.error('localStorage.list falhou:', e); }
  return simMemoryStore;
}
async function simDelete(name){
  try{
    if(window.storage){ await window.storage.delete('sim:' + name); return; }
  } catch(e){}
  try{
    if(lsAvailable()){ localStorage.removeItem('sim:' + name); return; }
  } catch(e){}
  delete simMemoryStore[name];
}

function snapshotState(){
  return JSON.parse(JSON.stringify({
    empreendimento: state.empreendimento,
    etapas: state.etapas,
    despesaCategorias: state.despesaCategorias
  }));
}
function loadSnapshot(snap){
  state.empreendimento = snap.empreendimento || state.empreendimento;
  state.etapas = snap.etapas || [];
  state.despesaCategorias = snap.despesaCategorias || [];
  state.ui.openTipos = {};
}

/* =========================================================================
   DESFAZER / REFAZER — histórico de estados (etapas, tipos, despesas).
   Toda ação que MUDA dado (editar campo, adicionar/excluir etapa, tipo,
   intercalada, despesa, parcela etc.) empilha o estado anterior aqui antes
   de aplicar a mudança. Ctrl+Z desfaz, Ctrl+Shift+Z (ou Ctrl+Y) refaz —
   e os botões ↶ / ↷ no canto superior direito fazem o mesmo, em qualquer aba.
   Abrir/fechar um tipo ou trocar de aba é só UI, não entra nesse histórico.
   ========================================================================= */
let undoStack = [];
let redoStack = [];
const UNDO_LIMIT = 80;

function pushUndo(){
  undoStack.push(snapshotState());
  if(undoStack.length > UNDO_LIMIT) undoStack.shift();
  redoStack = [];
  updateUndoRedoButtons();
}
function doUndo(){
  if(undoStack.length === 0) return;
  redoStack.push(snapshotState());
  loadSnapshot(undoStack.pop());
  renderAll();
  updateUndoRedoButtons();
  toast('↶ Ação desfeita');
}
function doRedo(){
  if(redoStack.length === 0) return;
  undoStack.push(snapshotState());
  loadSnapshot(redoStack.pop());
  renderAll();
  updateUndoRedoButtons();
  toast('↷ Ação refeita');
}
function updateUndoRedoButtons(){
  const bU = document.getElementById('btnUndo'), bR = document.getElementById('btnRedo');
  if(bU) bU.disabled = undoStack.length === 0;
  if(bR) bR.disabled = redoStack.length === 0;
}
function initUndoRedo(){
  document.getElementById('btnUndo')?.addEventListener('click', doUndo);
  document.getElementById('btnRedo')?.addEventListener('click', doRedo);
  document.addEventListener('keydown', (e) => {
    const mod = e.ctrlKey || e.metaKey;
    if(!mod) return;
    const key = e.key.toLowerCase();
    const isUndo = key === 'z' && !e.shiftKey;
    const isRedo = (key === 'z' && e.shiftKey) || key === 'y';
    if(!isUndo && !isRedo) return;
    const tag = document.activeElement ? document.activeElement.tagName : '';
    // se o foco está num campo de texto/select, deixa o undo nativo do navegador cuidar da digitação
    if(tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
    e.preventDefault();
    if(isUndo) doUndo(); else doRedo();
  });
}

/* =========================================================================
   MODAL DE CONFIRMAÇÃO — substitui o confirm() nativo do navegador (que em
   alguns visualizadores/abas embutidas fica bloqueado e nunca aparece,
   fazendo a exclusão "não funcionar"). Sempre funciona, em qualquer contexto.
   ========================================================================= */
let _confirmCallback = null;
function showConfirm(message, onConfirm, opts = {}){
  const backdrop = document.getElementById('confirmBackdrop');
  document.getElementById('confirmTitle').textContent = opts.title || 'Confirmar exclusão';
  document.getElementById('confirmMessage').textContent = message;
  document.getElementById('confirmOk').textContent = opts.okLabel || 'Excluir';
  _confirmCallback = onConfirm;
  backdrop.classList.add('open');
}
function closeConfirm(){
  document.getElementById('confirmBackdrop').classList.remove('open');
  _confirmCallback = null;
}
function initConfirmModal(){
  document.getElementById('confirmCancel')?.addEventListener('click', closeConfirm);
  document.getElementById('confirmBackdrop')?.addEventListener('click', (e) => {
    if(e.target.id === 'confirmBackdrop') closeConfirm();
  });
  document.getElementById('confirmOk')?.addEventListener('click', () => {
    const cb = _confirmCallback;
    document.getElementById('confirmBackdrop').classList.remove('open');
    _confirmCallback = null;
    if(cb) cb();
  });
}

/* =========================================================================
   SALVAMENTO AUTOMÁTICO — dispara sozinho a cada alteração, numa chave própria
   (não mexe nas simulações nomeadas nem no botão "Salvar Simulação").
   Mesma ordem de prioridade: window.storage → localStorage → memória.
   ========================================================================= */
let autosaveMemory = null;
let autosaveTimer = null;
let autosaveReady = false; // evita autosalvar antes da restauração inicial terminar

function setAutosaveStatus(text){
  const el = document.getElementById('autosaveStatus');
  if(el) el.textContent = text;
}

function scheduleAutosave(){
  if(!autosaveReady) return; // ainda restaurando o estado inicial, não sobrescreve
  clearTimeout(autosaveTimer);
  setAutosaveStatus('salvando…');
  autosaveTimer = setTimeout(async () => {
    const snap = snapshotState();
    const horaAgora = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
    try{
      if(window.storage){
        await window.storage.set('autosave-current', JSON.stringify(snap));
        setAutosaveStatus('✓ salvo automaticamente ' + horaAgora);
        return;
      }
    } catch(e){ console.error('autosave via storage falhou:', e); }
    try{
      if(lsAvailable()){
        localStorage.setItem('autosave-current', JSON.stringify(snap));
        setAutosaveStatus('✓ salvo automaticamente ' + horaAgora);
        return;
      }
    } catch(e){ console.error('autosave via localStorage falhou:', e); }
    autosaveMemory = snap;
    setAutosaveStatus('✓ salvo nesta sessão ' + horaAgora);
  }, 700);
}

async function restoreAutosave(){
  try{
    if(window.storage){
      const r = await window.storage.get('autosave-current').catch(()=>null);
      if(r && r.value) return JSON.parse(r.value);
    }
  } catch(e){ console.error('restore autosave (storage) falhou:', e); }
  try{
    if(lsAvailable()){
      const v = localStorage.getItem('autosave-current');
      if(v) return JSON.parse(v);
    }
  } catch(e){ console.error('restore autosave (localStorage) falhou:', e); }
  return autosaveMemory;
}

function toast(msg){
  let el = document.getElementById('toastMsg');
  if(!el){
    el = document.createElement('div');
    el.id = 'toastMsg';
    el.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0E1B2A;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:1200;box-shadow:0 8px 24px rgba(0,0,0,.3);';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, 2400);
}

async function renderSimList(filter){
  const list = document.getElementById('openSimList');
  if(!list) return;
  const all = await simGetAll();
  const names = Object.keys(all).filter(n => !filter || n.toLowerCase().includes(filter.toLowerCase())).sort();
  if(names.length === 0){
    list.innerHTML = '<div class="sim-list-empty">Nenhuma simulação salva ainda.</div>';
    return;
  }
  list.innerHTML = names.map(n => `
    <div class="sim-list-item" data-sim-open="${esc(n)}">
      <span>${esc(n)}</span>
      <button class="sim-del" data-sim-del="${esc(n)}" title="Excluir">✕</button>
    </div>`).join('');
  list.querySelectorAll('[data-sim-open]').forEach(el => {
    el.addEventListener('click', async (ev) => {
      if(ev.target.closest('[data-sim-del]')) return;
      const name = el.dataset.simOpen;
      const all2 = await simGetAll();
      if(all2[name]){
        pushUndo();
        loadSnapshot(all2[name]);
        document.getElementById('openSimBackdrop').classList.remove('open');
        renderAll();
        toast('Simulação "' + name + '" carregada.');
      }
    });
  });
  list.querySelectorAll('[data-sim-del]').forEach(el => {
    el.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      const name = el.dataset.simDel;
      showConfirm(`Excluir a simulação salva "${name}"? Isso não afeta o que está aberto agora, só remove essa simulação da lista.`, async () => {
        await simDelete(name);
        renderSimList(document.getElementById('openSimSearch').value);
      });
    });
  });
}

function downloadBlob(content, filename, mime){
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function aiFindEtapa(nome){ return state.etapas.find(e => e.nome.toLowerCase().includes(String(nome).toLowerCase())); }
function aiFindTipo(etapa, nome){ return etapa && etapa.tipos.find(t => t.nome.toLowerCase().includes(String(nome).toLowerCase())); }
function aiFindCategoria(nome){ return state.despesaCategorias.find(c => c.nome.toLowerCase().includes(String(nome).toLowerCase())); }
function aiNum(v){
  if(typeof v === 'number') return v;
  const s = String(v).trim();
  // se tem vírgula, é formatação BR (ex: "1.234,56") — usa o parser BR
  if(s.includes(',')) return parseNumberBR(s);
  // senão, número "normal" com ponto decimal (ex: "1.5", "320000") — não confundir ponto com milhar
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

const AI_DISPATCH = {
  set_tipo_field(args){
    const e = aiFindEtapa(args.etapa); const t = aiFindTipo(e, args.tipo);
    if(!t) return { ok:false, error:'Tipo não encontrado: ' + args.etapa + ' / ' + args.tipo };
    t[args.campo] = args.campo === 'nome' ? args.valor : aiNum(args.valor);
    return { ok:true, mensagem: `${t.nome}: ${args.campo} = ${args.valor}` };
  },
  set_pagamento_field(args){
    const e = aiFindEtapa(args.etapa); const t = aiFindTipo(e, args.tipo);
    if(!t) return { ok:false, error:'Tipo não encontrado.' };
    const comp = t.pagamento[args.componente];
    if(!comp) return { ok:false, error:'Componente inválido.' };
    let campo = args.campo;
    const ehInicio = (campo === 'mesInicio' || campo === 'mesInicioFixo');
    if(ehInicio && args.componente === 'mensais1') campo = 'mesInicioFixo';                              // Mensais 1: mês inicial fixo
    else if(ehInicio && args.componente === 'mensais2'){ comp.mesInicioAuto = false; campo = 'mesInicioManual'; } // Mensais 2: desliga o início automático
    else if(ehInicio) campo = 'mesInicio';                                                               // Entrada
    if(campo === 'jurosAtivo'){
      comp.jurosAtivo = (args.valor === true || ['true','sim','1'].includes(String(args.valor).toLowerCase()));
    } else {
      comp[campo] = aiNum(args.valor);
    }
    return { ok:true, mensagem: `${t.nome} · ${args.componente}.${campo} = ${args.valor}` };
  },
  add_intercalada(args){
    const e = aiFindEtapa(args.etapa); const t = aiFindTipo(e, args.tipo);
    if(!t) return { ok:false, error:'Tipo não encontrado.' };
    t.pagamento.intercaladas.push({ id: uid('int'), nome: args.nome, valor: args.valor, qtd: args.qtd, mesInicio: args.mesInicio,
      periodicidade: args.periodicidade, jurosAtivo: !!args.jurosAtivo, jurosTaxa: args.jurosTaxa || 0 });
    return { ok:true, mensagem: `Intercalada "${args.nome}" adicionada em ${t.nome}.` };
  },
  set_intercalada_field(args){
    const e = aiFindEtapa(args.etapa); const t = aiFindTipo(e, args.tipo);
    const ic = t && t.pagamento.intercaladas.find(x => x.nome.toLowerCase().includes(args.intercalada.toLowerCase()));
    if(!ic) return { ok:false, error:'Intercalada não encontrada.' };
    if(args.campo === 'jurosAtivo'){
      ic.jurosAtivo = (args.valor === true || ['true','sim','1'].includes(String(args.valor).toLowerCase()));
    } else if(['valor','qtd','mesInicio','jurosTaxa'].includes(args.campo)){
      ic[args.campo] = aiNum(args.valor);
    } else {
      ic[args.campo] = args.valor;
    }
    return { ok:true, mensagem: `${ic.nome}: ${args.campo} = ${args.valor}` };
  },
  add_etapa(args){
    state.etapas.push(novaEtapa(args.nome));
    return { ok:true, mensagem: `Etapa "${args.nome}" criada.` };
  },
  add_tipo(args){
    const e = aiFindEtapa(args.etapa);
    if(!e) return { ok:false, error:'Etapa não encontrada.' };
    e.tipos.push(novoTipo(args.nome));
    return { ok:true, mensagem: `Tipo "${args.nome}" criado em ${e.nome}.` };
  },
  add_categoria_despesa(args){
    state.despesaCategorias.push({ id: uid('cat'), nome: args.nome, despesas: [] });
    return { ok:true, mensagem: `Categoria "${args.nome}" criada.` };
  },
  add_despesa(args){
    const c = aiFindCategoria(args.categoria);
    if(!c) return { ok:false, error:'Categoria não encontrada.' };
    c.despesas.push({ id: uid('desp'), nome: args.nome, valor: args.valor, mesInicio: args.mesInicio, mesFim: args.mesFim });
    return { ok:true, mensagem: `Despesa "${args.nome}" adicionada em ${c.nome}.` };
  },
  set_despesa_field(args){
    const c = aiFindCategoria(args.categoria);
    const d = c && c.despesas.find(x => x.nome.toLowerCase().includes(args.despesa.toLowerCase()));
    if(!d) return { ok:false, error:'Despesa não encontrada.' };
    d[args.campo] = args.campo === 'nome' ? args.valor : aiNum(args.valor);
    return { ok:true, mensagem: `${d.nome}: ${args.campo} = ${args.valor}` };
  },
  get_resumo(){
    const fg = calcFluxoGeral();
    return { ok:true, vgvTotal: fg.vgvTotal, receitaTotal: fg.receitaTotal, custoTotal: fg.custoTotal,
      resultado: fg.resultado, margem: fg.margem.toFixed(1)+'%', necessidadeMaxCapital: Math.abs(fg.maiorNecessidade), prazoMeses: fg.maxMes };
  }
};

function aiBuildSystemPrompt(){
  const resumo = state.etapas.map(e => ({
    etapa: e.nome,
    tipos: e.tipos.map(t => ({ nome: t.nome, quantidade: t.quantidade, precoRef: t.precoRef, mesEntrega: t.mesEntrega,
      intercaladas: t.pagamento.intercaladas.map(ic => ic.nome) }))
  }));
  const categorias = state.despesaCategorias.map(c => ({ categoria: c.nome, despesas: c.despesas.map(d => d.nome) }));
  return `Você é o assistente especialista deste simulador de viabilidade financeira imobiliária. Fale em português do Brasil, de forma direta e curta.
Você PODE modificar o empreendimento chamando as ferramentas disponíveis (nunca apenas diga que fez algo sem chamar a ferramenta correspondente).
Estrutura atual do empreendimento (nomes de etapas, tipos e categorias que você pode referenciar):
${JSON.stringify(resumo)}
Categorias de despesa:
${JSON.stringify(categorias)}
Ao alterar um valor monetário ou quantidade, use os nomes de etapa/tipo/categoria como aparecem acima (busca é por substring, não precisa ser exato).
Cada componente de recebimento (entrada, mensais1, mensais2, e cada intercalada) pode ter juros compostos mensais opcionais (campo jurosAtivo + jurosTaxa em %). Quando o usuário pedir para "adicionar juros" em algum lugar, use set_pagamento_field ou set_intercalada_field para ligar jurosAtivo=true e definir jurosTaxa com o percentual pedido.
Depois de executar as ferramentas, responda em 1-2 frases confirmando o que mudou, em português.`;
}

function aiRenderMessages(){
  const box = document.getElementById('aiMessages');
  if(!box) return;
  box.innerHTML = aiState.messages.map(m => `<div class="ai-msg ${m.role}">${esc(m.text)}</div>`).join('');
  box.scrollTop = box.scrollHeight;
}
function aiPush(role, text){
  aiState.messages.push({ role, text });
  aiRenderMessages();
}

async function aiSendMessage(userText){
  if(!aiState.apiKey){
    aiPush('error', 'Configure sua chave da API Groq no ⚙️ antes de conversar.');
    return;
  }
  if(aiState.busy) return;
  aiState.busy = true;
  aiPush('user', userText);

  const history = [
    { role:'system', content: aiBuildSystemPrompt() },
    ...aiState.messages.filter(m=>m.role==='user'||m.role==='assistant').slice(-10).map(m => ({ role: m.role, content: m.text }))
  ];

  try{
    let resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + aiState.apiKey },
      body: JSON.stringify({ model:'openai/gpt-oss-120b', messages: history, tools: AI_TOOLS, tool_choice:'auto', temperature:0.2 })
    });
    if(!resp.ok){
      const errText = await resp.text().catch(()=> '');
      aiPush('error', 'Erro na API Groq (' + resp.status + '). Verifique a chave. ' + errText.slice(0,140));
      aiState.busy = false; return;
    }
    let data = await resp.json();
    let msg = data.choices[0].message;

    if(msg.tool_calls && msg.tool_calls.length){
      pushUndo(); // uma chamada de undo cobre todas as alterações desse turno do assistente
      const toolMsgs = [];
      const changes = [];
      for(const tc of msg.tool_calls){
        const fn = AI_DISPATCH[tc.function.name];
        let args = {};
        try{ args = JSON.parse(tc.function.arguments || '{}'); } catch(e){}
        const result = fn ? fn(args) : { ok:false, error:'Ferramenta desconhecida.' };
        if(result.mensagem) changes.push(result.mensagem);
        toolMsgs.push({ role:'tool', tool_call_id: tc.id, content: JSON.stringify(result) });
      }
      renderAll();
      if(changes.length) aiPush('system-note', '✓ ' + changes.join(' · '));

      const followup = [...history, msg, ...toolMsgs];
      const resp2 = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + aiState.apiKey },
        body: JSON.stringify({ model:'openai/gpt-oss-120b', messages: followup, temperature:0.2 })
      });
      if(resp2.ok){
        const data2 = await resp2.json();
        aiPush('assistant', data2.choices[0].message.content || 'Feito.');
      } else {
        aiPush('assistant', 'Alterações aplicadas.');
      }
    } else {
      aiPush('assistant', msg.content || '...');
    }
  } catch(e){
    aiPush('error', 'Falha de conexão com a API Groq: ' + e.message);
  }
  aiState.busy = false;
}

async function initAI(){
  try{
    if(window.storage){
      const r = await window.storage.get('groq-api-key').catch(()=>null);
      if(r && r.value){ aiState.apiKey = r.value; document.getElementById('aiApiKey').value = r.value; }
    } else if(lsAvailable()){
      const v = localStorage.getItem('groq-api-key');
      if(v){ aiState.apiKey = v; document.getElementById('aiApiKey').value = v; }
    }
  } catch(e){}

  document.getElementById('btnAI')?.addEventListener('click', () => {
    document.getElementById('aiOverlay').classList.toggle('open');
    if(aiState.messages.length === 0){
      aiPush('assistant', 'Oi! Posso explicar seus números ou já ajustar valores — ex: "aumente o preço do Tipo 1 pra 320 mil" ou "crie uma despesa de marketing de 50 mil do mês 1 ao 6".');
    }
  });
  document.getElementById('aiClose')?.addEventListener('click', () => document.getElementById('aiOverlay').classList.remove('open'));
  document.getElementById('aiSettingsToggle')?.addEventListener('click', () => {
    document.getElementById('aiSettings').classList.toggle('open');
  });
  document.getElementById('aiApiKey')?.addEventListener('change', async (e) => {
    aiState.apiKey = e.target.value.trim();
    try{
      if(window.storage){ await window.storage.set('groq-api-key', aiState.apiKey); }
      else if(lsAvailable()){ localStorage.setItem('groq-api-key', aiState.apiKey); }
    } catch(err){}
  });
  const send = () => {
    const input = document.getElementById('aiInput');
    const text = input.value.trim();
    if(!text) return;
    input.value = '';
    aiSendMessage(text);
  };
  document.getElementById('aiSend')?.addEventListener('click', send);
  document.getElementById('aiInput')?.addEventListener('keydown', (e) => { if(e.key === 'Enter') send(); });
}
initAI();
initUndoRedo();
initConfirmModal();

(async function boot(){
  const saved = await restoreAutosave();
  if(saved){ loadSnapshot(saved); }
  autosaveReady = true;
  renderAll();
  updateUndoRedoButtons();
  if(saved) setAutosaveStatus('sessão anterior restaurada');
})();
</script>
