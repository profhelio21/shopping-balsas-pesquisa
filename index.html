<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viabilidade — Simulador de Empreendimentos</title>
<meta name="description" content="Simulador de viabilidade financeira de empreendimentos imobiliários.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E1B2A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230E1B2A%27/%3E%3Cpath d=%27M14 46V30l12-10 12 10v16M38 46V26l12 8v12%27 fill=%27none%27 stroke=%27%230B6E4F%27 stroke-width=%275%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1B2A;
  --surface:#E7E9EA;
  --card:#FFFFFF;
  --line:#D6DAD9;
  --accent:#0B6E4F;
  --accent-dim:#E4F1EC;
  --gold:#B8862E;
  --gold-dim:#FBF1DF;
  --red:#B0402E;
  --red-dim:#FBEAE6;
  --muted:#6B7680;
  --sidebar:#0E1B2A;
  --sidebar-line:#1E3040;
  --sidebar-text:#9FB2C2;
  --petrol:#0F5C6B;
  --petrol-dim:#E1EFF1;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--surface);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.num, table, input, select, .mono{font-family:'IBM Plex Mono',monospace;}

/* sign coloring — só em valores calculados/exibidos, nunca nos campos editáveis.
   peso maior aqui deixa todo número "de resultado" mais marcado, destacado do texto ao redor. */
.v-pos{color:var(--accent);font-weight:700;}
.v-neg{color:var(--red);font-weight:700;}
.v-neutral{color:var(--ink);font-weight:700;}
input.num-input{color:var(--ink) !important;}

/* layout */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:230px;flex-shrink:0;background:var(--sidebar);color:var(--sidebar-text);
  padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden;
  transition:width .2s ease, padding .2s ease;
}
#app.sidebar-collapsed #sidebar{width:0;padding:22px 0;}
#app.sidebar-collapsed #sidebar > *{opacity:0;pointer-events:none;}
.sidebar-toggle-btn{
  all:unset;cursor:pointer;position:fixed;top:16px;left:16px;z-index:1100;
  width:36px;height:36px;border-radius:8px;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 3px 10px rgba(0,0,0,.25);
}
.sidebar-toggle-btn:hover{background:#152534;}

/* undo/redo — sempre visível, em qualquer aba, num canto que não disputa espaço com o menu lateral */
.undo-redo-bar{
  position:fixed;top:16px;right:16px;z-index:1100;display:flex;align-items:center;gap:2px;
  background:var(--ink);border-radius:9px;padding:5px;box-shadow:0 3px 10px rgba(0,0,0,.25);
}
.undo-redo-sep{width:1px;align-self:stretch;background:var(--sidebar-line);margin:2px 1px;}
.undo-redo-btn{
  all:unset;cursor:pointer;box-sizing:border-box;height:34px;padding:0 12px;border-radius:6px;
  display:flex;align-items:center;gap:7px;color:#fff;font-size:16px;font-weight:700;
}
.undo-redo-btn .undo-redo-label{font-family:'Inter';font-size:12px;font-weight:600;color:var(--sidebar-text);}
.undo-redo-btn:hover:not(:disabled){background:#152534;}
.undo-redo-btn:hover:not(:disabled) .undo-redo-label{color:#fff;}
.undo-redo-btn:disabled{opacity:.32;cursor:not-allowed;}
@media (max-width:700px){ .undo-redo-btn .undo-redo-label{display:none;} .undo-redo-btn{padding:0 10px;} }
#sidebar .brand{
  font-family:'IBM Plex Mono',monospace;color:#fff;font-size:13px;letter-spacing:.08em;
  text-transform:uppercase;padding:0 10px 18px 42px;border-bottom:1px solid var(--sidebar-line);margin-bottom:14px;
  position:relative;min-height:20px;transition:opacity .15s;
}
#sidebar .brand b{color:var(--accent);}
#sidebar .brand small{display:block;color:var(--sidebar-text);font-weight:400;margin-top:4px;font-size:11px;letter-spacing:0;text-transform:none;}
nav.tabs{display:flex;flex-direction:column;gap:2px;}
nav.tabs button{
  all:unset;cursor:pointer;padding:10px 10px;border-radius:6px;font-size:13.5px;white-space:nowrap;
  color:var(--sidebar-text);display:flex;align-items:center;gap:9px;
}
nav.tabs button .dot{width:6px;height:6px;border-radius:50%;background:var(--sidebar-line);flex-shrink:0;}
nav.tabs button:hover{background:#152534;color:#fff;}
nav.tabs button.active{background:var(--accent);color:#fff;}
nav.tabs button.active .dot{background:#fff;}
#sidebar .foot{margin-top:20px;padding-top:14px;border-top:1px solid var(--sidebar-line);font-size:10.5px;color:#5A6E80;line-height:1.5;white-space:nowrap;}

#main{flex:1;padding:26px 34px 60px 62px;max-width:1620px;transition:padding .2s ease;}
#app.sidebar-collapsed #main{padding-left:62px;}
h1.page-title{font-size:20px;font-weight:800;margin:0 0 3px 0;letter-spacing:-.01em;}
p.page-sub{color:var(--muted);font-size:13px;margin:0 0 22px 0;}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 22px;box-shadow:0 1px 3px rgba(14,27,42,.04);}
.card + .card{margin-top:22px;}
.card h2{font-size:14px;font-weight:700;margin:0 0 16px 0;padding-bottom:12px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em;color:#334;}
.card h2 small{text-transform:none;font-weight:400;color:var(--muted);letter-spacing:0;font-size:11.5px;}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden;}
.kpi .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
.kpi .val{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:800;}
.kpi.neg .val{color:var(--red);}
.kpi.pos .val{color:var(--accent);}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line);}
.kpi.pos .bar{background:var(--accent);}
.kpi.neg .bar{background:var(--red);}

/* buttons */
.btn{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:6px;
  background:var(--ink);color:#fff;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{opacity:.88;}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
.btn.accent{background:var(--accent);}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red-dim);}
.btn.danger:hover{background:var(--red-dim);}
.btn.sm{padding:4px 9px;font-size:11.5px;}

/* etapa / tipo blocks — modernizado: cartões brancos, sombra leve, espaçamento generoso e bem demarcado */
.etapa-block{
  border:2.5px solid var(--red);border-radius:14px;margin-bottom:30px;overflow:hidden;background:var(--card);
  box-shadow:0 2px 8px rgba(176,64,46,.12);position:relative;transition:border-color .15s, box-shadow .15s;
}
.etapa-block.completa{border-color:var(--accent);box-shadow:0 2px 8px rgba(11,110,79,.12);}
.etapa-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 20px 28px;background:#F5F7F4;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:14px;}
.etapa-head input.etapa-nome{
  border:none;border-bottom:2px dashed #A9B4B8;background:transparent;font-weight:800;font-size:22px;
  font-family:'Inter';width:290px;letter-spacing:-.01em;border-radius:0;padding:3px 4px;
  transition:border-color .15s, background .15s;
}
.etapa-head input.etapa-nome:hover{border-bottom-color:var(--petrol);}
.etapa-head input.etapa-nome:focus{outline:none;border-bottom-color:var(--petrol);background:var(--petrol-dim);}
.etapa-summary-chips{display:flex;gap:10px;flex-wrap:wrap;}
.etapa-chip{background:var(--accent-dim);color:var(--accent);border-radius:20px;padding:7px 17px;font-size:13.5px;font-weight:700;font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
.etapa-body{padding:26px 28px;display:flex;flex-direction:column;gap:22px;}
.etapa-body > .btn{align-self:flex-start;}

.tipo-block{
  border:1px solid var(--line);border-radius:12px;margin-bottom:0;background:var(--card);
  box-shadow:0 1px 4px rgba(14,27,42,.05);transition:box-shadow .15s, border-color .15s;overflow:hidden;
}
.tipo-block:hover{box-shadow:0 4px 16px rgba(14,27,42,.09);border-color:#D3D8D2;}
.tipo-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;cursor:pointer;user-select:none;gap:16px;flex-wrap:wrap;}
.tipo-head:hover{background:#FAFBF9;}
.tipo-head .tname{font-weight:800;font-size:19px;display:flex;align-items:center;gap:11px;color:var(--ink);letter-spacing:-.005em;}
.tipo-head .chev{transition:transform .15s;color:var(--muted);font-size:13px;}
.tipo-head.open .chev{transform:rotate(90deg);}
.progress-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
.progress-dot.gray{background:#C7CCC8;}
.progress-dot.yellow{background:var(--gold);}
.progress-dot.green{background:var(--accent);}
.tipo-stats{display:flex;gap:10px;flex-wrap:wrap;flex:1;}
.tipo-stat-chip{
  background:#F0F2EE;border-radius:8px;padding:8px 15px;display:flex;flex-direction:column;line-height:1.4;min-width:78px;
}
.tipo-stat-chip .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;}
.tipo-stat-chip .v{font-weight:800;font-size:16px;font-family:'IBM Plex Mono',monospace;color:var(--ink);}
.tipo-head-actions{display:flex;gap:6px;flex-shrink:0;}
.tipo-body{display:none;padding:20px 22px 24px 22px;border-top:1px solid var(--line);background:#FCFDFC;}
.tipo-body.open{display:block;}
/* campos de "Dados do Tipo" um pouco maiores que o padrão do app — é a informação mais consultada da tela Etapas & Tipos */
.tipo-body .field label{font-size:11.5px;}
.tipo-body .field input, .tipo-body .field select{font-size:15px;padding:10px 12px;}
.tipo-body .subsection-title{font-size:13px;}

.field-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin-bottom:16px;}
.field-row:last-child{margin-bottom:0;}
.field{display:flex;flex-direction:column;gap:5px;border-radius:8px;transition:color .15s;}
.field label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;transition:color .15s;}
.field:focus-within label{color:var(--petrol);}
.field input, .field select{
  border:1.5px solid #C6CCCA;border-radius:7px;padding:8px 10px;font-size:13.5px;background:#fff;color:var(--ink);
  transition:border-color .15s, box-shadow .15s, background .15s;
}
.field input:focus, .field select:focus{outline:none;border-color:var(--petrol);box-shadow:0 0 0 3px var(--petrol-dim);}
.field input:disabled{opacity:.55;background:#EFF1EE;cursor:not-allowed;}
/* campos numéricos — a "lacuna" onde o valor é digitado: marcados com peso maior e leve contraste
   pra ficar óbvio que é um campo editável, diferente dos números só exibidos (.readout, spans calculados) */
.field input.num-input, .field input.pct-input{
  font-weight:700;background:#FBFDFC;border-color:#B7C3C7;
}
.field input.num-input:hover, .field input.pct-input:hover{border-color:var(--petrol);}
.field .readout{
  border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:14px;background:#FAFBF9;
  font-family:'IBM Plex Mono',monospace;font-weight:800;color:var(--ink);
}

/* subseções — agora blocos bem demarcados (borda + fundo + acento lateral) em vez de linha tracejada fina,
   com numeração visual pra deixar a sequência de etapas do fluxo (Entrada → Mensais 1 → Intercaladas → Mensais 2) óbvia */
.subsection{
  margin-top:18px;padding:16px 18px;border:1px solid var(--line);border-left:3px solid var(--petrol);
  border-radius:10px;background:#FAFBFC;
}
.subsection.subsection-first{margin-top:0;}
.subsection-title{
  font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--petrol);
  margin:-2px 0 14px 0;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
}
.subsection-title .subsection-title-main{display:flex;align-items:center;gap:9px;}
.subsection-title .hint{color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0;margin:0;}
.step-badge{
  display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;
  background:var(--petrol);color:#fff;font-size:10.5px;font-weight:800;flex-shrink:0;font-family:'IBM Plex Mono',monospace;
}

.intercalada-row{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:8px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:8px;}
.intercalada-row:last-of-type{margin-bottom:0;}
.intercalada-row .field{flex:1 1 110px;min-width:100px;}
.intercalada-row .field label{font-size:9.5px;}

/* conferencia badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;font-family:'IBM Plex Mono';}
.badge.ok{background:var(--accent-dim);color:var(--accent);}
.badge.warn{background:var(--gold-dim);color:var(--gold);}
.badge.bad{background:var(--red-dim);color:var(--red);}

.conf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px;padding:12px;background:#FAFBF9;border-radius:8px;}
.conf-item .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;}
.conf-item .v{font-family:'IBM Plex Mono';font-size:14.5px;font-weight:800;}
.fechamento-indicator{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:11px;font-weight:600;font-family:'Inter';color:var(--muted);}
.fechamento-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.fechamento-dot.green{background:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
.fechamento-dot.red{background:var(--red);box-shadow:0 0 0 3px var(--red-dim);}
.conf-summary-msg{font-family:'Inter';font-weight:600;font-size:13px;padding:8px 12px;border-radius:7px;}
.conf-summary-msg.ok{background:var(--accent-dim);color:var(--accent);}
.conf-summary-msg.warn{background:var(--gold-dim);color:#8A6A1E;}
.conf-summary-msg.bad{background:var(--red-dim);color:var(--red);}

/* despesas */
.categoria-block{
  border:1px solid var(--line);border-radius:12px;margin-bottom:20px;padding:0;overflow:hidden;
  background:var(--card);box-shadow:0 1px 4px rgba(14,27,42,.05);
}
.categoria-head{
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
  padding:14px 18px;background:#F5F7F4;border-bottom:1px solid var(--line);
}
.categoria-head input{
  border:none;border-bottom:2px dashed #A9B4B8;background:transparent;font-weight:800;font-size:14.5px;
  font-family:'Inter';border-radius:0;padding:2px 3px;transition:border-color .15s, background .15s;
}
.categoria-head input:hover{border-bottom-color:var(--petrol);}
.categoria-head input:focus{outline:none;border-bottom-color:var(--petrol);background:var(--petrol-dim);}
.categoria-body{padding:16px 18px;display:flex;flex-direction:column;gap:12px;}

.despesa-item{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:#FCFDFC;}
.despesa-item-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px dashed var(--line);}
.despesa-item-head input.despesa-nome{
  border:none;border-bottom:2px dashed #A9B4B8;background:transparent;font-weight:700;font-size:13.5px;
  font-family:'Inter';flex:1;min-width:160px;border-radius:0;padding:2px 3px;
  transition:border-color .15s, background .15s;
}
.despesa-item-head input.despesa-nome:hover{border-bottom-color:var(--petrol);}
.despesa-item-head input.despesa-nome:focus{outline:none;border-bottom-color:var(--petrol);background:var(--petrol-dim);}
.despesa-modo-select{border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:11.5px;background:#fff;color:var(--ink);}
.despesa-modo-hint{font-size:11.5px;color:var(--muted);margin-bottom:10px;}

.parcela-row{
  display:grid;grid-template-columns:1.6fr .9fr .7fr auto;gap:8px;align-items:end;margin-bottom:8px;
  padding:9px 10px;background:#fff;border:1px solid var(--line);border-radius:8px;
}
.parcela-row:last-of-type{margin-bottom:0;}
.parcela-row .field label{font-size:9.5px;}
.parcelas-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
.parcelas-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px;}
.parcelas-total-chip{
  font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;color:var(--petrol);
  background:var(--petrol-dim);border-radius:20px;padding:5px 13px;white-space:nowrap;
}

/* table */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;}
table.data{border-collapse:collapse;width:100%;font-size:12px;}
table.data th{
  background:#F0F2EE;text-align:right;padding:8px 10px;font-weight:600;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.03em;color:#445;position:sticky;top:0;border-bottom:1px solid var(--line);
}
table.data th:first-child, table.data td:first-child{text-align:left;position:sticky;left:0;background:#F0F2EE;}
table.data td{padding:6px 10px;text-align:right;border-bottom:1px solid #EEF0EC;white-space:nowrap;}
table.data td:first-child{background:#FBFCFA;font-weight:600;}
table.data tr.neg td{color:var(--red);}
table.data tr:hover td{background:#F5FAF7;}
table.data tr.neg:hover td{background:#FBEEEC;}

/* alerts */
.alert{display:flex;gap:10px;padding:10px 13px;border-radius:8px;margin-bottom:8px;font-size:13px;align-items:flex-start;}
.alert.bad{background:var(--red-dim);color:#7A2A1D;}
.alert.warn{background:var(--gold-dim);color:#7A5A15;}
.alert .ico{font-family:'IBM Plex Mono';font-weight:700;}
.empty-alerts{color:var(--muted);font-size:13px;padding:10px 0;}

/* chart containers */
.chart-box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;}
.chart-box canvas{max-height:280px;}
.chart-tall{position:relative;height:340px;width:100%;}
.chart-mid{position:relative;height:260px;width:100%;}
.chart-tall canvas, .chart-mid canvas{max-height:none !important;display:block;cursor:crosshair;}
.chart-tooltip{
  display:none;position:absolute;background:var(--ink);color:#fff;border-radius:8px;padding:9px 12px;
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.25);
  z-index:5;min-width:140px;
}
.chart-tooltip .tip-month{font-weight:700;margin-bottom:5px;color:var(--gold);font-size:11px;}
.chart-tooltip .tip-row{display:flex;align-items:center;gap:6px;line-height:1.6;white-space:nowrap;}
.chart-tooltip .tip-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:900px){.chart-grid{grid-template-columns:1fr;}}

/* cabeçalho de gráfico com título + legenda em linha (estilo dashboard executivo) */
.chart-header-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.chart-title-teal{margin:0;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--petrol);}
.chart-legend-inline{display:flex;gap:16px;flex-wrap:wrap;}
.legend-dot-item{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--muted);font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
.legend-dot-item .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.scroll-x-wrap{overflow-x:auto;padding-bottom:8px;}
.chart-wide{height:320px;min-width:100%;}
.chart-wide canvas{max-height:none !important;display:block;height:100%;}

/* variante escura, estilo "dashboard financeiro" (imagem de referência) */
.chart-box-dark{background:var(--ink);border-color:#1E3040;}
.chart-title-dark{margin:0;font-size:14px;font-weight:800;color:#fff;display:flex;align-items:center;gap:8px;}
.chart-subtitle-dark{margin:3px 0 0 0;font-size:11.5px;color:#8FA3B5;}
.chart-legend-inline.dark .legend-dot-item{color:#B7C6D3;}
.chart-box-dark .chart-tooltip{background:#0A1420;border:1px solid #1E3040;}

/* timeline ruler - signature element */
.ruler{display:flex;align-items:flex-end;height:34px;margin:4px 0 14px 0;position:relative;border-bottom:2px solid var(--ink);}
.ruler .tick{position:absolute;bottom:0;width:1px;background:var(--line);}
.ruler .tick.major{background:var(--ink);}
.ruler .tick-label{position:absolute;bottom:4px;font-size:9px;font-family:'IBM Plex Mono';color:var(--muted);transform:translateX(-50%);}

/* divisor de etapa na tela de Receitas — separa bem os grupos de tipos de cada etapa,
   com uma régua horizontal acima (exceto no primeiro) pra marcar claramente onde uma etapa termina e outra começa */
.receita-etapa-group{margin-top:36px;padding-top:22px;border-top:2px solid var(--line);}
.receita-etapa-group:first-of-type{margin-top:0;padding-top:0;border-top:none;}
.section-label{
  font-size:14px;font-weight:800;text-transform:uppercase;color:var(--accent);letter-spacing:.06em;
  margin:0 0 16px 2px;display:flex;align-items:center;gap:9px;
}
.section-label::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;}

/* card de receita por tipo — contorno completo marcando se o fluxo configurado já fecha com o preço alvo */
.receita-card{border:2.5px solid var(--red);box-shadow:0 2px 8px rgba(176,64,46,.1);}
.receita-card.completa{border-color:var(--accent);box-shadow:0 2px 8px rgba(11,110,79,.1);}
.receita-card-title small{display:block;margin-top:2px;font-weight:500;}

.hint{font-size:12px;color:var(--muted);margin-top:6px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:900px){.two-col{grid-template-columns:1fr;}}
select.scenario-select{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12.5px;background:#fff;}

/* explorador mensal — range slider estilizado */
input[type="range"]{
  -webkit-appearance:none;width:100%;height:6px;border-radius:4px;
  background:linear-gradient(90deg, var(--accent) 0%, var(--line) 0%);outline:none;margin:10px 0 4px 0;
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--ink);
  border:3px solid #fff;box-shadow:0 0 0 1px var(--ink);cursor:pointer;margin-top:-6px;
}
input[type="range"]::-moz-range-thumb{
  width:18px;height:18px;border-radius:50%;background:var(--ink);border:3px solid #fff;box-shadow:0 0 0 1px var(--ink);cursor:pointer;
}
input[type="range"]::-webkit-slider-runnable-track{height:6px;border-radius:4px;background:var(--line);}
.slider-labels{display:flex;justify-content:space-between;font-family:'IBM Plex Mono';font-size:11px;color:var(--muted);}
.slider-labels #monthSliderNow{color:var(--ink);font-weight:700;background:var(--accent-dim);padding:1px 8px;border-radius:10px;}

/* calculadora flutuante */
#sidebar .calc-btn{
  all:unset;cursor:pointer;width:100%;box-sizing:border-box;padding:9px 10px;border-radius:6px;
  color:var(--sidebar-text);display:flex;align-items:center;gap:9px;font-size:13px;margin-top:6px;
}
#sidebar .calc-btn:hover{background:#152534;color:#fff;}
#calcOverlay{
  display:none;position:fixed;left:16px;bottom:16px;z-index:999;
  background:var(--sidebar);border:1px solid var(--sidebar-line);border-radius:12px;
  box-shadow:0 12px 32px rgba(0,0,0,.35);padding:12px;width:220px;
}
#calcOverlay.open{display:block;}
.calc-head{display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:12.5px;font-weight:700;margin-bottom:8px;letter-spacing:.03em;text-transform:uppercase;}
.calc-head button{all:unset;cursor:pointer;color:var(--sidebar-text);font-size:14px;padding:2px 6px;}
.calc-head button:hover{color:#fff;}
.calc-display{
  background:#0A1420;color:#fff;font-family:'IBM Plex Mono';font-size:22px;text-align:right;
  padding:12px 10px;border-radius:8px;margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.calc-grid button{
  all:unset;cursor:pointer;text-align:center;padding:11px 0;border-radius:6px;background:#16283A;color:#fff;
  font-family:'IBM Plex Mono';font-size:14px;font-weight:600;
}
.calc-grid button:hover{background:#1E3A52;}
.calc-grid button.op{background:var(--accent);}
.calc-grid button.op:hover{background:#0d8a63;}
.calc-grid button.wide{grid-column:span 2;}

/* sidebar extras */
.sidebar-section-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#5A6E80;margin:16px 10px 6px 10px;}
.sidebar-export-row{display:flex;flex-direction:column;gap:4px;}
.export-btn{
  all:unset;cursor:pointer;width:100%;box-sizing:border-box;padding:8px 10px;border-radius:6px;
  color:var(--sidebar-text);font-size:12.5px;display:flex;align-items:center;gap:8px;
}
.export-btn:hover{background:#152534;color:#fff;}

/* modais genéricos */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(14,27,42,.55);z-index:1000;align-items:center;justify-content:center;padding:20px;}
.modal-backdrop.open{display:flex;}
.modal-box{background:#fff;border-radius:12px;padding:20px;width:380px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal-box h3{margin:0 0 14px 0;font-size:15px;font-weight:700;}
.modal-box .field{margin-bottom:4px;}
.modal-box .field input{width:100%;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
.sim-list{max-height:240px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;margin-top:8px;}
.sim-list-item{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;}
.sim-list-item:last-child{border-bottom:none;}
.sim-list-item:hover{background:var(--accent-dim);}
.sim-list-item .sim-del{all:unset;cursor:pointer;color:var(--red);font-size:12px;padding:2px 6px;flex-shrink:0;}
.sim-list-empty{padding:16px;color:var(--muted);font-size:12.5px;text-align:center;}

/* assistente de IA */
#aiOverlay{
  display:none;position:fixed;right:16px;bottom:16px;z-index:999;background:#fff;border:1px solid var(--line);
  border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.28);width:360px;max-width:92vw;height:500px;max-height:82vh;
  flex-direction:column;overflow:hidden;
}
#aiOverlay.open{display:flex;}
.ai-head{background:var(--sidebar);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;flex-shrink:0;}
.ai-head button{all:unset;cursor:pointer;color:var(--sidebar-text);font-size:14px;padding:2px 4px;}
.ai-head button:hover{color:#fff;}
.ai-settings{padding:0;max-height:0;overflow:hidden;border-bottom:0 solid var(--line);background:#FAFBF9;font-size:11.5px;transition:max-height .15s;flex-shrink:0;}
.ai-settings.open{padding:10px 14px;max-height:120px;border-bottom:1px solid var(--line);}
.ai-settings input{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;margin-top:4px;font-family:'IBM Plex Mono';}
.ai-messages{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:9px;}
.ai-msg{font-size:12.5px;line-height:1.5;max-width:88%;padding:8px 11px;border-radius:10px;word-wrap:break-word;}
.ai-msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:2px;}
.ai-msg.assistant{align-self:flex-start;background:#F0F2EE;color:var(--ink);border-bottom-left-radius:2px;}
.ai-msg.system-note{align-self:center;background:var(--gold-dim);color:#7A5A15;font-size:11px;padding:5px 10px;text-align:center;}
.ai-msg.error{align-self:center;background:var(--red-dim);color:#7A2A1D;font-size:11.5px;text-align:center;}
.ai-input-row{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line);flex-shrink:0;}
.ai-input-row input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;}

@media print{
  #sidebar, #calcOverlay, #aiOverlay, .modal-backdrop, .btn, input[type="range"], .subsection-title button{display:none !important;}
  #main{padding:0;max-width:100%;}
  body{background:#fff;}
  .card, .chart-box, .kpi{break-inside:avoid;}
}

<script>
/* =========================================================================
   ESTADO — fonte única de verdade
   ========================================================================= */
const state = {
  empreendimento: { nome: "Novo Empreendimento" },
  etapas: [],
  despesaCategorias: [],
  ui: { openTipos: {}, activeTab: "dashboard" }
};

function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,9); }
// escapa texto digitado pelo usuário antes de colocar em innerHTML/atributos (nomes com aspas, < ou &)
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

/* =========================================================================
   MOTOR DE GRÁFICOS — canvas nativo do navegador, zero dependências externas.
   Funciona 100% offline (sem CDN), essencial pro fluxo de trabalho local.
   ========================================================================= */
const CV = { green:'#0B6E4F', red:'#B0402E', gold:'#B8862E', grid:'#EEF0EC', text:'#6B7680', ink:'#0E1B2A' };

function cvSetup(canvasEl){
  const dpr = window.devicePixelRatio || 1;
  const parent = canvasEl.parentElement;
  const w = Math.max(parent.clientWidth, 100);
  const h = Math.max(parent.clientHeight || canvasEl.clientHeight || 260, 100);
  canvasEl.width = w * dpr;
  canvasEl.height = h * dpr;
  canvasEl.style.width = w + 'px';
  canvasEl.style.height = h + 'px';
  const ctx = canvasEl.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx, w, h };
}
function cvNiceMax(v){
  if(v <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / mag;
  const step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
  return step * mag;
}

// gráfico de barras verticais (uma ou mais séries, aceita valores negativos)
function drawBarChart(canvasId, labels, series, opts = {}){
  const canvasEl = document.getElementById(canvasId);
  if(!canvasEl) return;
  const { ctx, w, h } = cvSetup(canvasEl);
  const padL = 66, padR = 14, padT = 14, padB = opts.showValues ? 26 : 24;
  const plotW = w - padL - padR, plotH = h - padT - padB;

  let maxV = 0, minV = 0;
  series.forEach(s => s.data.forEach(v => { maxV = Math.max(maxV, v); minV = Math.min(minV, v); }));
  maxV = cvNiceMax(maxV || 1);
  minV = minV < 0 ? -cvNiceMax(-minV) : 0;
  const range = (maxV - minV) || 1;
  const zeroY = padT + plotH * (maxV / range);

  ctx.strokeStyle = CV.grid; ctx.fillStyle = CV.text; ctx.font = "10px 'IBM Plex Mono', monospace";
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.lineWidth = 1;
  const steps = 4;
  for(let i = 0; i <= steps; i++){
    const val = maxV - (range * i / steps);
    const y = padT + plotH * i / steps;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.fillText(fmtMoneyCompact(val), padL - 8, y);
  }

  const n = labels.length || 1;
  const groupW = plotW / n;
  const barW = Math.max(1.5, Math.min(16, groupW / (series.length + 1)));
  const showValues = opts.showValues && n <= 40;
  ctx.font = "600 8.5px 'IBM Plex Mono', monospace";

  labels.forEach((lab, i) => {
    const gx = padL + groupW * i + groupW / 2;
    series.forEach((s, si) => {
      const v = s.data[i] || 0;
      const barH = plotH * (Math.abs(v) / range);
      const x = gx - (series.length * barW) / 2 + si * barW;
      const y = v >= 0 ? zeroY - barH : zeroY;
      ctx.fillStyle = s.color;
      ctx.fillRect(x, y, barW - 1.5, Math.max(barH, v !== 0 ? 1 : 0));
      if(showValues && v !== 0){
        ctx.fillStyle = CV.ink;
        ctx.textAlign = 'center';
        ctx.textBaseline = v >= 0 ? 'bottom' : 'top';
        ctx.fillText(fmtMoneyCompact(v), x + (barW - 1.5) / 2, v >= 0 ? y - 2 : y + barH + 2);
      }
    });
  });

  ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = CV.text;
  ctx.font = "9.5px 'IBM Plex Mono', monospace";
  const labelEvery = Math.max(1, Math.ceil(n / 14));
  labels.forEach((lab, i) => {
    if(i % labelEvery !== 0) return;
    ctx.fillText(lab, padL + groupW * i + groupW / 2, h - padB + 8);
  });

  ctx.strokeStyle = CV.ink; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(padL, zeroY); ctx.lineTo(w - padR, zeroY); ctx.stroke();

  if(opts.legend){
    ctx.font = "10px 'IBM Plex Mono', monospace"; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    let lx = padL;
    opts.legend.forEach(l => {
      ctx.fillStyle = l.color; ctx.fillRect(lx, 2, 9, 9);
      ctx.fillStyle = CV.text; ctx.fillText(l.label, lx + 13, 7);
      lx += ctx.measureText(l.label).width + 34;
    });
  }
}

// combo: barras (créditos/débitos) + linha (saldo acumulado) num segundo eixo
function drawComboChart(canvasId, labels, barSeries, lineData, opts = {}){
  const canvasEl = document.getElementById(canvasId);
  if(!canvasEl) return;
  const { ctx, w, h } = cvSetup(canvasEl);
  const padL = 62, padR = 62, padT = 22, padB = 24;
  const plotW = w - padL - padR, plotH = h - padT - padB;

  let maxV = 0, minV = 0;
  barSeries.forEach(s => s.data.forEach(v => { maxV = Math.max(maxV, v); minV = Math.min(minV, v); }));
  maxV = cvNiceMax(maxV || 1); minV = minV < 0 ? -cvNiceMax(-minV) : 0;
  const range = (maxV - minV) || 1;
  const zeroY = padT + plotH * (maxV / range);

  let maxL = Math.max(0, ...lineData), minL = Math.min(0, ...lineData);
  maxL = cvNiceMax(maxL || 1); minL = minL < 0 ? -cvNiceMax(-minL) : 0;
  const rangeL = (maxL - minL) || 1;

  ctx.strokeStyle = CV.grid; ctx.fillStyle = CV.text; ctx.font = "10px 'IBM Plex Mono', monospace";
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.lineWidth = 1;
  const steps = 4;
  for(let i = 0; i <= steps; i++){
    const val = maxV - (range * i / steps);
    const y = padT + plotH * i / steps;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.fillText(fmtMoneyCompact(val), padL - 8, y);
    ctx.textAlign = 'left';
    const valR = maxL - (rangeL * i / steps);
    ctx.fillText(fmtMoneyCompact(valR), w - padR + 8, y);
    ctx.textAlign = 'right';
  }

  const n = labels.length || 1;
  const groupW = plotW / n;
  const barW = Math.max(1.5, Math.min(14, groupW / (barSeries.length + 1)));
  labels.forEach((lab, i) => {
    const gx = padL + groupW * i + groupW / 2;
    barSeries.forEach((s, si) => {
      const v = s.data[i] || 0;
      const barH = plotH * (Math.abs(v) / range);
      const x = gx - (barSeries.length * barW) / 2 + si * barW;
      const y = v >= 0 ? zeroY - barH : zeroY;
      ctx.fillStyle = s.color;
      ctx.fillRect(x, y, barW - 1.5, Math.max(barH, v !== 0 ? 1 : 0));
    });
  });

  ctx.strokeStyle = CV.gold; ctx.lineWidth = 2.2; ctx.beginPath();
  lineData.forEach((v, i) => {
    const x = padL + groupW * i + groupW / 2;
    const y = padT + plotH * ((maxL - v) / rangeL);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();

  ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = CV.text;
  ctx.font = "9.5px 'IBM Plex Mono', monospace";
  const labelEvery = Math.max(1, Math.ceil(n / 14));
  labels.forEach((lab, i) => {
    if(i % labelEvery !== 0) return;
    ctx.fillText(lab, padL + groupW * i + groupW / 2, h - padB + 8);
  });

  ctx.strokeStyle = CV.ink; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(padL, zeroY); ctx.lineTo(w - padR, zeroY); ctx.stroke();

  if(opts.legend){
    ctx.font = "10px 'IBM Plex Mono', monospace"; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    let lx = padL;
    opts.legend.forEach(l => {
      ctx.fillStyle = l.color; ctx.fillRect(lx, 2, 9, 9);
      ctx.fillStyle = CV.text; ctx.fillText(l.label, lx + 13, 7);
      lx += ctx.measureText(l.label).width + 34;
    });
  }
}

// gráfico de ESCADINHA (step chart) interativo — passa o mouse e mostra os valores daquele mês
// opts.theme opcional: { grid, text, ink } — permite usar em cards escuros sem duplicar a função
function drawStepChart(canvasId, labels, series, opts = {}){
  const canvasEl = document.getElementById(canvasId);
  if(!canvasEl) return;
  const tooltipEl = document.getElementById(canvasId + 'Tip');
  const n = labels.length;
  const padL = 66, padR = 14, padT = 18, padB = 24;
  const theme = opts.theme || { grid: CV.grid, text: CV.text, ink: CV.ink };

  function render(hoverIdx){
    const { ctx, w, h } = cvSetup(canvasEl);
    const plotW = w - padL - padR, plotH = h - padT - padB;

    let maxV = 0, minV = 0;
    series.forEach(s => s.data.forEach(v => { maxV = Math.max(maxV, v); minV = Math.min(minV, v); }));
    maxV = cvNiceMax(maxV || 1);
    minV = minV < 0 ? -cvNiceMax(-minV) : 0;
    const range = (maxV - minV) || 1;
    const xAt = i => padL + (n <= 1 ? 0 : plotW * i / (n - 1));
    const yAt = v => padT + plotH * ((maxV - v) / range);

    ctx.strokeStyle = theme.grid; ctx.fillStyle = theme.text; ctx.font = "10px 'IBM Plex Mono', monospace";
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.lineWidth = 1;
    for(let i = 0; i <= 4; i++){
      const val = maxV - (range * i / 4);
      const y = padT + plotH * i / 4;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
      ctx.fillText(fmtMoneyCompact(val), padL - 8, y);
    }

    ctx.fillStyle = theme.text; ctx.font = "9.5px 'IBM Plex Mono', monospace"; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const labelEvery = Math.max(1, Math.ceil(n / 14));
    labels.forEach((lab, i) => { if(i % labelEvery !== 0) return; ctx.fillText(lab, xAt(i), h - padB + 8); });

    // linhas em escada (step-after: horizontal até o próximo mês, depois salto vertical)
    series.forEach(s => {
      ctx.strokeStyle = s.color; ctx.lineWidth = 2.2; ctx.beginPath();
      s.data.forEach((v, i) => {
        const x = xAt(i), y = yAt(v);
        if(i === 0){ ctx.moveTo(x, y); }
        else {
          const prevY = yAt(s.data[i - 1]);
          ctx.lineTo(x, prevY);
          ctx.lineTo(x, y);
        }
      });
      ctx.stroke();
    });

    const zeroY = yAt(0);
    ctx.strokeStyle = theme.ink; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(padL, zeroY); ctx.lineTo(w - padR, zeroY); ctx.stroke();

    if(opts.legend){
      ctx.font = "10px 'IBM Plex Mono', monospace"; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      let lx = padL;
      opts.legend.forEach(l => {
        ctx.fillStyle = l.color; ctx.fillRect(lx, 2, 9, 9);
        ctx.fillStyle = theme.text; ctx.fillText(l.label, lx + 13, 7);
        lx += ctx.measureText(l.label).width + 34;
      });
    }

    // guia vertical + pontos no mês em foco
    if(hoverIdx !== null && hoverIdx >= 0 && hoverIdx < n){
      const x = xAt(hoverIdx);
      ctx.strokeStyle = theme.ink; ctx.lineWidth = 1; ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, h - padB); ctx.stroke();
      ctx.setLineDash([]);
      series.forEach(s => {
        const y = yAt(s.data[hoverIdx]);
        ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fillStyle = opts.dotFill || '#fff'; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = s.color; ctx.stroke();
      });

      if(tooltipEl){
        const rows = series.map(s => `<div class="tip-row"><span class="tip-dot" style="background:${s.color}"></span>${s.label}: <b>${fmtMoney(s.data[hoverIdx])}</b></div>`).join('');
        tooltipEl.innerHTML = `<div class="tip-month">${labels[hoverIdx]}</div>${rows}`;
        tooltipEl.style.display = 'block';
        const parentW = canvasEl.parentElement.clientWidth;
        let left = x + 12;
        if(left + 150 > parentW) left = x - 162;
        tooltipEl.style.left = left + 'px';
        tooltipEl.style.top = '8px';
      }
    } else if(tooltipEl){
      tooltipEl.style.display = 'none';
    }
  }

  render(null);
  canvasEl.onmousemove = (ev) => {
    const rect = canvasEl.getBoundingClientRect();
    const mx = ev.clientX - rect.left;
    const plotW = rect.width - padL - padR;
    let idx = Math.round((mx - padL) / (plotW / Math.max(1, n - 1)));
    idx = Math.max(0, Math.min(n - 1, idx));
    render(idx);
  };
  canvasEl.onmouseleave = () => render(null);
}

// barras horizontais (uma série, ex. receita por etapa)
// barras agrupadas lado a lado (ex. Receitas x Despesas por semestre), com valores sempre visíveis
function drawGroupedBarChart(canvasId, buckets, opts = {}){
  const canvasEl = document.getElementById(canvasId);
  if(!canvasEl) return;
  const { ctx, w, h } = cvSetup(canvasEl);
  const padL = 64, padR = 16, padT = 30, padB = 30;
  const plotW = w - padL - padR, plotH = h - padT - padB;

  let maxV = 0;
  buckets.forEach(b => { maxV = Math.max(maxV, b.receitas, b.despesas); });
  maxV = cvNiceMax(maxV || 1);
  const n = buckets.length || 1;
  const groupW = plotW / n;
  const barW = Math.min(30, groupW * 0.32);
  const gap = 6;

  ctx.strokeStyle = CV.grid; ctx.fillStyle = CV.text; ctx.font = "10px 'IBM Plex Mono', monospace";
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.lineWidth = 1;
  for(let i = 0; i <= 4; i++){
    const val = maxV - (maxV * i / 4);
    const y = padT + plotH * i / 4;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.fillText(fmtMoneyCompact(val), padL - 10, y);
  }

  const colorA = opts.colorA || '#2F6FED', colorB = opts.colorB || '#D94F45';
  buckets.forEach((b, i) => {
    const gx = padL + groupW * i + groupW / 2;

    const hR = plotH * (b.receitas / maxV);
    const xR = gx - barW - gap / 2;
    ctx.fillStyle = colorA;
    ctx.fillRect(xR, padT + plotH - hR, barW, Math.max(hR, b.receitas > 0 ? 1 : 0));
    ctx.font = "700 9.5px 'IBM Plex Mono', monospace"; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText(fmtMoneyCompact(b.receitas), xR + barW / 2, padT + plotH - hR - 4);

    const hD = plotH * (b.despesas / maxV);
    const xD = gx + gap / 2;
    ctx.fillStyle = colorB;
    ctx.fillRect(xD, padT + plotH - hD, barW, Math.max(hD, b.despesas > 0 ? 1 : 0));
    ctx.fillText(fmtMoneyCompact(b.despesas), xD + barW / 2, padT + plotH - hD - 4);

    ctx.font = "9.5px 'IBM Plex Mono', monospace"; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = CV.text;
    ctx.fillText(b.label, gx, h - padB + 8);
  });

  ctx.strokeStyle = CV.ink; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(padL, padT + plotH); ctx.lineTo(w - padR, padT + plotH); ctx.stroke();
}

// barras horizontais (uma série, ex. receita por etapa)
function drawHBarChart(canvasId, labels, values, color){
  const canvasEl = document.getElementById(canvasId);
  if(!canvasEl) return;
  const { ctx, w, h } = cvSetup(canvasEl);
  const padL = 90, padR = 60, padT = 10, padB = 10;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const maxV = cvNiceMax(Math.max(1, ...values));
  const n = labels.length || 1;
  const rowH = plotH / n;
  const barH = Math.min(28, rowH * 0.55);

  ctx.font = "10.5px 'IBM Plex Mono', monospace"; ctx.textBaseline = 'middle';
  labels.forEach((lab, i) => {
    const y = padT + rowH * i + rowH / 2;
    const barW = plotW * (values[i] / maxV);
    ctx.textAlign = 'right'; ctx.fillStyle = CV.text;
    ctx.fillText(lab, padL - 10, y);
    ctx.fillStyle = color;
    ctx.fillRect(padL, y - barH / 2, barW, barH);
    ctx.textAlign = 'left'; ctx.fillStyle = CV.ink; ctx.font = "600 10.5px 'IBM Plex Mono', monospace";
    ctx.fillText(fmtMoneyCompact(values[i]), padL + barW + 8, y);
    ctx.font = "10.5px 'IBM Plex Mono', monospace";
  });
}

// gráfico de rosca (doughnut) — categorias de custo
function drawDoughnutChart(canvasId, labels, values, colors){
  const canvasEl = document.getElementById(canvasId);
  if(!canvasEl) return;
  const { ctx, w, h } = cvSetup(canvasEl);
  const total = values.reduce((a, b) => a + b, 0) || 1;
  const legendH = 20 * Math.ceil(labels.length / 2) + 10;
  const cx = w / 2, cy = (h - legendH) / 2 + 4;
  const rOuter = Math.min(cx, cy) * 0.85, rInner = rOuter * 0.6;
  let start = -Math.PI / 2;
  labels.forEach((lab, i) => {
    const slice = (values[i] / total) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(start) * rInner, cy + Math.sin(start) * rInner);
    ctx.arc(cx, cy, rOuter, start, start + slice);
    ctx.arc(cx, cy, rInner, start + slice, start, true);
    ctx.closePath();
    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();
    start += slice;
  });
  // legenda
  ctx.font = "10px 'IBM Plex Mono', monospace"; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const legendY0 = h - legendH + 6;
  const colW = w / 2;
  labels.forEach((lab, i) => {
    const col = i % 2, row = Math.floor(i / 2);
    const lx = 10 + col * colW, ly = legendY0 + row * 20;
    ctx.fillStyle = colors[i % colors.length];
    ctx.fillRect(lx, ly - 5, 9, 9);
    ctx.fillStyle = CV.text;
    const pct = (values[i] / total * 100).toFixed(0) + '%';
    ctx.fillText(lab.length > 16 ? lab.slice(0, 15) + '…' : lab, lx + 13, ly);
    ctx.textAlign = 'right'; ctx.fillText(pct, lx + colW - 14, ly);
    ctx.textAlign = 'left';
  });
}

const PERIODICIDADE_STEP = { mensal:1, bimestral:2, trimestral:3, semestral:6, anual:12 };

function calcTipoVGV(tipo){ return tipo.quantidade * tipo.precoRef; }

// indicador de progresso do cadastro básico do tipo (não interfere em nenhum cálculo financeiro)
function calcTipoProgress(tipo){
  const filled = [tipo.area, tipo.quantidade, tipo.precoRef, tipo.mesEntrega].filter(v => Number(v) > 0).length;
  if(filled === 0) return 'gray';
  if(filled < 4) return 'yellow';
  return 'green';
}

// indicador de progresso da etapa como um todo — completa (verde) só quando TODOS os tipos
// dela têm os dados básicos preenchidos (mesmo critério do pontinho de cada tipo); qualquer
// tipo faltando algo, ou etapa sem nenhum tipo, deixa a etapa incompleta (vermelha).
function calcEtapaProgress(etapa){
  if(!etapa.tipos.length) return 'incompleta';
  return etapa.tipos.every(t => calcTipoProgress(t) === 'green') ? 'completa' : 'incompleta';
}

// gera o fluxo de recebiveis de UM tipo.
// porMes é AGREGADO (já x quantidade de unidades) — usado no fluxo de caixa geral.
// totalEntrada/totalMensais1/totalIntercaladas/totalMensais2/totalGeral são POR UNIDADE —
// usados na conferência contra o Preço Alvo (que também é por unidade).
// gera o fluxo de UM tipo em duas trilhas paralelas:
//  - porMes (SEM juros): usado em todo o resto do app (Dashboard, Fluxo de Caixa, comparação de VGV por etapa)
//  - porMesJuros: só o valor do juros arrecadado por mês (agregado)
// Os totais (totalEntrada, totalMensais1, totalGeral, etc.) continuam COM juros, exatamente como
// já funcionava na tela de Receitas — nada muda ali. O juros só deixa de "vazar" pros valores finais do app.
function calcFluxoTipo(tipo){
  const p = tipo.pagamento;
  const qtdUnid = tipo.quantidade;
  const porMes = {};        // sem juros
  const porMesJuros = {};   // só o juros
  const addBase = (mes, v) => { if(!mes || mes < 1) return; porMes[mes] = (porMes[mes]||0) + v * qtdUnid; };
  const addJuros = (mes, v) => { if(!mes || mes < 1) return; porMesJuros[mes] = (porMesJuros[mes]||0) + v * qtdUnid; };
  // taxa de juros compostos por parcela: parcela_i = valorBase * (1+taxa)^i (i começa em 0, então a 1ª parcela nunca sofre juro)
  const jurosMultiplicador = (comp, i) => comp.jurosAtivo ? Math.pow(1 + (comp.jurosTaxa||0)/100, i) : 1;

  // ENTRADA — valor é o valor de CADA parcela (mesma lógica de Mensais 1/2), parcelas iguais a partir do mesInicio
  let totalEntradaBase = 0, totalEntradaComJuros = 0;
  {
    const n = Math.max(1, p.entrada.qtd|0);
    for(let i=0;i<n;i++){
      const base = p.entrada.valor;
      const comJuros = base * jurosMultiplicador(p.entrada, i);
      addBase(p.entrada.mesInicio + i, base);
      addJuros(p.entrada.mesInicio + i, comJuros - base);
      totalEntradaBase += base; totalEntradaComJuros += comJuros;
    }
  }

  // MENSAIS 1 — mes 2 até mesEntrega-1 (parametrizável via mesInicioFixo)
  const m1Inicio = p.mensais1.mesInicioFixo;
  const m1Fim = Math.max(m1Inicio - 1, tipo.mesEntrega - 1);
  const m1Qtd = Math.max(0, m1Fim - m1Inicio + 1);
  let totalMensais1Base = 0, totalMensais1ComJuros = 0;
  {
    let idx = 0;
    for(let m = m1Inicio; m <= m1Fim; m++){
      const base = p.mensais1.valor;
      const comJuros = base * jurosMultiplicador(p.mensais1, idx);
      addBase(m, base);
      addJuros(m, comJuros - base);
      totalMensais1Base += base; totalMensais1ComJuros += comJuros;
      idx++;
    }
  }

  // INTERCALADAS — N ocorrências a partir do mesInicio, step por periodicidade
  let totalIntercaladasBase = 0, totalIntercaladasComJuros = 0;
  const intercaladasInfo = [];
  p.intercaladas.forEach(ic => {
    const step = PERIODICIDADE_STEP[ic.periodicidade] || 1;
    let totBase = 0, totComJuros = 0;
    const meses = [];
    for(let i=0;i<ic.qtd;i++){
      const mes = ic.mesInicio + i*step;
      const base = ic.valor;
      const comJuros = base * jurosMultiplicador(ic, i);
      addBase(mes, base);
      addJuros(mes, comJuros - base);
      totBase += base; totComJuros += comJuros;
      meses.push(mes);
    }
    totalIntercaladasBase += totBase; totalIntercaladasComJuros += totComJuros;
    intercaladasInfo.push({ id: ic.id, nome: ic.nome, total: totBase, totalComJuros: totComJuros, totalJuros: totComJuros-totBase, meses });
  });

  // MENSAIS 2 — a partir do mês de entrega (ou manual).
  // Antes começava em mesEntrega+1: como Mensais 1 já termina em mesEntrega-1 (mês anterior à entrega),
  // sobrava o mês da entrega em si sem nenhuma parcela agendada (ficava 0 na planilha/fluxo de caixa) —
  // corrigido pra Mensais 2 começar exatamente no mês de entrega, fechando esse buraco.
  let totalMensais2Base = 0, totalMensais2ComJuros = 0;
  let m2Inicio = 0, m2Fim = 0, m2Qtd = 0;
  if(p.mensais2.ativo){
    m2Inicio = p.mensais2.mesInicioAuto ? tipo.mesEntrega : (p.mensais2.mesInicioManual || tipo.mesEntrega);
    m2Qtd = Math.max(0, p.mensais2.qtd|0);
    m2Fim = m2Inicio + m2Qtd - 1;
    for(let i=0;i<m2Qtd;i++){
      const base = p.mensais2.valor;
      const comJuros = base * jurosMultiplicador(p.mensais2, i);
      addBase(m2Inicio+i, base);
      addJuros(m2Inicio+i, comJuros - base);
      totalMensais2Base += base; totalMensais2ComJuros += comJuros;
    }
  }

  // a conferência da tela de Receitas (subtotal, diferença, % atingido) usa SEMPRE o valor SEM juros —
  // o juros é só informação extra, nunca entra nessa conta. Ele só aparece de fato no comparativo do Resumo Geral.
  const totalGeralComJuros = totalEntradaComJuros + totalMensais1ComJuros + totalIntercaladasComJuros + totalMensais2ComJuros;
  const totalGeral = totalEntradaBase + totalMensais1Base + totalIntercaladasBase + totalMensais2Base;
  const totalJuros = totalGeralComJuros - totalGeral;
  const precoAlvoTotal = tipo.precoRef; // preço alvo é por unidade
  const diferenca = precoAlvoTotal - totalGeral;
  const pctAtingido = precoAlvoTotal > 0 ? (totalGeral / precoAlvoTotal * 100) : 0;

  return {
    porMes, porMesJuros,
    totalEntrada: totalEntradaBase, totalMensais1: totalMensais1Base,
    totalIntercaladas: totalIntercaladasBase, totalMensais2: totalMensais2Base,
    totalGeral, totalGeralComJuros, totalJuros,
    precoAlvoTotal, diferenca, pctAtingido,
    mensais1Info: { mesInicio: m1Inicio, mesFim: m1Fim, qtd: m1Qtd },
    mensais2Info: { mesInicio: m2Inicio, mesFim: m2Fim, qtd: m2Qtd },
    intercaladasInfo
  };
}

function aggregateTotal(porMes){
  return Object.values(porMes).reduce((a,b)=>a+b,0);
}

function calcEtapa(etapa){
  const tipos = etapa.tipos.map(t => ({ tipo: t, fluxo: calcFluxoTipo(t) }));
  const vgv = tipos.reduce((s,x)=>s+calcTipoVGV(x.tipo),0);
  const unidades = etapa.tipos.reduce((s,t)=>s+t.quantidade,0);
  const totalRecebido = tipos.reduce((s,x)=>s+aggregateTotal(x.fluxo.porMes),0); // sem juros
  const totalJuros = tipos.reduce((s,x)=>s+aggregateTotal(x.fluxo.porMesJuros),0);
  const porMes = {};
  const porMesJuros = {};
  tipos.forEach(x => {
    Object.entries(x.fluxo.porMes).forEach(([m,v])=>{ porMes[m]=(porMes[m]||0)+v; });
    Object.entries(x.fluxo.porMesJuros).forEach(([m,v])=>{ porMesJuros[m]=(porMesJuros[m]||0)+v; });
  });
  return { tipos, vgv, unidades, totalRecebido, totalJuros, diferenca: vgv-totalRecebido,
           pct: vgv>0 ? totalRecebido/vgv*100 : 0, porMes, porMesJuros };
}

// total de uma despesa, seja qual for o modo de lançamento (linear ou parcelas por data)
function calcDespesaTotal(d){
  if(d.modo === 'parcelas') return (d.parcelas||[]).reduce((s,pc)=>s + (Number(pc.valor)||0), 0);
  return Number(d.valor)||0;
}

function calcDespesaCategoria(cat){
  const porMes = {};
  let total = 0;
  cat.despesas.forEach(d => {
    if(d.modo === 'parcelas'){
      // parcelas por data — cada uma cai integralmente no mês em que é paga (ex: cada investidor paga sua
      // parte do terreno num mês diferente), sem distribuição linear entre elas
      (d.parcelas||[]).forEach(pc => {
        const v = Number(pc.valor)||0;
        const mes = Number(pc.mes)||0;
        if(mes >= 1) porMes[mes] = (porMes[mes]||0) + v;
        total += v;
      });
    } else {
      const n = Math.max(1, d.mesFim - d.mesInicio + 1);
      const parcela = d.valor / n;
      for(let m=d.mesInicio; m<=d.mesFim; m++){ porMes[m] = (porMes[m]||0) + parcela; }
      total += d.valor;
    }
  });
  return { porMes, total };
}

function calcDespesasTotais(){
  const porMes = {};
  let total = 0;
  const porCategoria = state.despesaCategorias.map(cat => {
    const c = calcDespesaCategoria(cat);
    Object.entries(c.porMes).forEach(([m,v])=>{ porMes[m]=(porMes[m]||0)+v; });
    total += c.total;
    return { categoria: cat, ...c };
  });
  return { porMes, total, porCategoria };
}

// consolida tudo: horizonte de meses, créditos/débitos por etapa, saldo, saldo acumulado.
// Todos os valores "oficiais" (creditosTotal, receitaTotal, resultado, margem) são SEM juros.
// O juros arrecadado fica disponível à parte (jurosMes, totalJurosGeral, receitaComJurosTotal, etc.)
// pra ser exibido no Resumo Geral, sem contaminar os números principais do app.
function calcFluxoGeral(){
  const etapasCalc = state.etapas.map(e => ({ etapa: e, calc: calcEtapa(e) }));
  const despesas = calcDespesasTotais();

  let maxMes = 1;
  etapasCalc.forEach(x => Object.keys(x.calc.porMes).forEach(m => { maxMes = Math.max(maxMes, +m); }));
  Object.keys(despesas.porMes).forEach(m => { maxMes = Math.max(maxMes, +m); });

  const linhas = [];
  let saldoAcum = 0;
  let maiorNecessidade = 0, mesMaiorNecessidade = 0;
  for(let mes=1; mes<=maxMes; mes++){
    const creditosPorEtapa = etapasCalc.map(x => x.calc.porMes[mes] || 0);
    const creditosTotal = creditosPorEtapa.reduce((a,b)=>a+b,0);
    const jurosMes = etapasCalc.reduce((s,x)=>s+(x.calc.porMesJuros[mes]||0),0);
    const debitoMes = despesas.porMes[mes] || 0;
    const saldoMes = creditosTotal - debitoMes;
    saldoAcum += saldoMes;
    if(saldoAcum < maiorNecessidade){ maiorNecessidade = saldoAcum; mesMaiorNecessidade = mes; }
    linhas.push({ mes, creditosPorEtapa, creditosTotal, jurosMes, debitoMes, saldoMes, saldoAcum });
  }

  const vgvTotal = etapasCalc.reduce((s,x)=>s+x.calc.vgv,0);
  const unidadesTotal = etapasCalc.reduce((s,x)=>s+x.calc.unidades,0);
  const receitaTotal = etapasCalc.reduce((s,x)=>s+x.calc.totalRecebido,0);
  const totalJurosGeral = etapasCalc.reduce((s,x)=>s+x.calc.totalJuros,0);
  const custoTotal = despesas.total;
  const resultado = receitaTotal - custoTotal;
  const margem = receitaTotal>0 ? resultado/receitaTotal*100 : 0;

  const receitaComJurosTotal = receitaTotal + totalJurosGeral;
  const resultadoComJuros = receitaComJurosTotal - custoTotal;
  const margemComJuros = receitaComJurosTotal>0 ? resultadoComJuros/receitaComJurosTotal*100 : 0;

  return { etapasCalc, despesas, linhas, maxMes, vgvTotal, unidadesTotal, receitaTotal, custoTotal,
           resultado, margem, maiorNecessidade, mesMaiorNecessidade,
           totalJurosGeral, receitaComJurosTotal, resultadoComJuros, margemComJuros };
}

function calcAlertas(fg){
  const alertas = [];
  fg.linhas.forEach(l => {
    if(l.saldoMes < 0 && Math.abs(l.saldoMes) > 0.01){
      // só alerta saldo mensal negativo relevante, não polui muito
    }
    if(l.saldoAcum < 0 && Math.abs(l.saldoAcum) > 0.01){
      // marcado abaixo por faixa, evita 1 alerta por mês
    }
  });
  // necessidade máxima de capital
  if(fg.maiorNecessidade < -0.01){
    alertas.push({ tipo:'bad', texto: `Necessidade máxima de capital: ${fmtMoney(Math.abs(fg.maiorNecessidade))} no mês ${fg.mesMaiorNecessidade}.` });
  }
  // conferência por tipo
  fg.etapasCalc.forEach(({etapa, calc}) => {
    calc.tipos.forEach(({tipo, fluxo}) => {
      const pct = fluxo.pctAtingido;
      if(pct < 98){
        alertas.push({ tipo: pct < 90 ? 'bad':'warn',
          texto: `${etapa.nome} · ${tipo.nome}: fluxo atinge ${pct.toFixed(1)}% do preço alvo (faltam ${fmtMoney(fluxo.diferenca)}).` });
      } else if(pct > 102){
        alertas.push({ tipo:'warn',
          texto: `${etapa.nome} · ${tipo.nome}: fluxo excede o preço alvo em ${fmtMoney(-fluxo.diferenca)}.` });
      }
    });
  });
  // despesas: no modo linear, distribuído = valor total sempre (validamos só mesFim>=mesInicio);
  // no modo parcelas, validamos que existe pelo menos uma parcela e que os meses são válidos
  fg.despesas.porCategoria.forEach(pc => {
    pc.categoria.despesas.forEach(d => {
      if(d.modo === 'parcelas'){
        const parcelas = d.parcelas || [];
        if(parcelas.length === 0){
          alertas.push({ tipo:'warn', texto: `Despesa "${d.nome}" (${pc.categoria.nome}): nenhuma parcela cadastrada.` });
        }
        parcelas.forEach(pcl => {
          if(!(Number(pcl.mes) >= 1)){
            alertas.push({ tipo:'bad', texto: `Despesa "${d.nome}" (${pc.categoria.nome}): parcela "${pcl.nome}" com mês inválido.` });
          }
        });
      } else if(d.mesFim < d.mesInicio){
        alertas.push({ tipo:'bad', texto: `Despesa "${d.nome}" (${pc.categoria.nome}): mês final antes do mês inicial.` });
      }
    });
  });
  return alertas;
}

/* =========================================================================
   FORMATAÇÃO
   ========================================================================= */
function fmtMoney(v){
  const n = Number(v)||0;
  const sign = n < 0 ? "-" : "";
  return sign + "R$ " + Math.abs(n).toLocaleString('pt-BR', {minimumFractionDigits:0, maximumFractionDigits:0});
}
function fmtMoneyFull(v){
  const n = Number(v)||0;
  return n.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}
function fmtPct(v){ return (Number(v)||0).toFixed(1) + "%"; }

// cor por sinal — só usada em valores calculados/exibidos (nunca em campos editáveis)
function moneyClass(v){
  const n = Number(v)||0;
  if(Math.abs(n) < 0.005) return 'v-neutral';
  return n > 0 ? 'v-pos' : 'v-neg';
}
function spanMoney(v){ return `<span class="${moneyClass(v)}">${fmtMoney(v)}</span>`; }
function spanPct(v){ return `<span class="${moneyClass(v-0)}">${fmtPct(v)}</span>`; }
// coloração semântica (não pelo sinal): receita/entrada é sempre verde, custo/gasto é sempre vermelho
function spanPos(v){ return `<span class="v-pos">${fmtMoney(v)}</span>`; }
function spanNeg(v){ return `<span class="v-neg">${fmtMoney(v)}</span>`; }
function fmtMoneyCompact(v){
  const n = Number(v)||0;
  const abs = Math.abs(n);
  const sign = n < 0 ? "-" : "";
  if(abs >= 1000000) return sign + (abs/1000000).toFixed(1).replace('.',',') + "mi";
  if(abs >= 1000) return sign + (abs/1000).toFixed(0) + "mil";
  return sign + abs.toFixed(0);
}

/* formatação de número no padrão BR (1.000, 1.234,5) sem quebrar o parse */
function formatNumberBR(raw){
  if(raw === '' || raw === null || raw === undefined || isNaN(raw)) return '';
  return Number(raw).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
}
function parseNumberBR(str){
  if(str === '' || str === null || str === undefined) return 0;
  // remove tudo que não é dígito, vírgula ou sinal de menos; ponto = separador de milhar (remove); vírgula = decimal
  let s = String(str).trim();
  const negative = /^-/.test(s);
  s = s.replace(/[^\d,.-]/g, '');
  s = s.replace(/-/g, '');
  s = s.replace(/\./g, '');       // remove separador de milhar
  s = s.replace(',', '.');        // vírgula vira ponto decimal
  const n = parseFloat(s);
  const result = isNaN(n) ? 0 : n;
  return negative ? -result : result;
}
// parser pra campos de percentual (ex: taxa de juros) — aqui NÃO existe separador de milhar,
// então tanto ponto quanto vírgula são tratados como decimal (1.5 e 1,5 dão o mesmo resultado)
function parsePercent(str){
  if(str === '' || str === null || str === undefined) return 0;
  const s = String(str).trim().replace(',', '.').replace(/[^\d.\-]/g, '');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function attachNumberFormatting(root){
  root.querySelectorAll('input.num-input').forEach(el => {
    if(el.dataset.fmtBound) return;
    el.dataset.fmtBound = "1";
    // formata o valor inicial ao renderizar
    el.value = formatNumberBR(parseNumberBR(el.value));
    el.addEventListener('input', () => {
      const cursorFromEnd = el.value.length - (el.selectionStart ?? el.value.length);
      const raw = parseNumberBR(el.value);
      const hasContent = el.value.replace(/[^\d]/g,'') !== '';
      el.value = hasContent ? formatNumberBR(raw) : '';
      const pos = Math.max(0, el.value.length - cursorFromEnd);
      try{ el.setSelectionRange(pos, pos); }catch(e){}
    });
  });
}

}

/* =========================================================================
   VIEW: FLUXO DE CAIXA
   ========================================================================= */
function viewFluxo(fg){
  const maxTick = fg.maxMes;
  const majorEvery = maxTick > 48 ? 12 : (maxTick > 24 ? 6 : 3);
  let ticks = '';
  for(let m=1; m<=maxTick; m++){
    const isMajor = m % majorEvery === 0 || m===1;
    const left = (m-1)/(maxTick-1||1) * 100;
    ticks += `<div class="tick ${isMajor?'major':''}" style="left:${left}%;height:${isMajor?'14px':'7px'};"></div>`;
    if(isMajor) ticks += `<div class="tick-label" style="left:${left}%;">M${m}</div>`;
  }
  return `
    <h1 class="page-title">Fluxo de Caixa Mensal</h1>
    <p class="page-sub">Horizonte de ${fg.maxMes} meses, expandido automaticamente conforme a última parcela ou despesa cadastrada.</p>
    <div class="ruler">${ticks}</div>
    <div class="table-wrap">
      <table class="data">
        <thead><tr>
          <th>Mês</th>
          ${fg.etapasCalc.map(x=>`<th>Créd. ${esc(x.etapa.nome)}</th>`).join('')}
          <th>Créd. Total</th><th>Débitos</th><th>Saldo Mês</th><th>Saldo Acum.</th>
        </tr></thead>
        <tbody>
          ${fg.linhas.map(l => `
            <tr class="${l.saldoAcum<0?'neg':''}">
              <td>M${l.mes}</td>
              ${l.creditosPorEtapa.map(v=>`<td>${spanMoney(v)}</td>`).join('')}
              <td>${spanMoney(l.creditosTotal)}</td>
              <td>${spanMoney(-l.debitoMes)}</td>
              <td>${spanMoney(l.saldoMes)}</td>
              <td>${spanMoney(l.saldoAcum)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function updateMonthPanel(fg, mes){
  const panel = document.getElementById('monthSliderPanel');
  const now = document.getElementById('monthSliderNow');
  if(now) now.textContent = 'M' + mes;
  if(!panel) return;
  if(mes <= 0){ panel.innerHTML = monthPanelHTML(0,0,0,0,0,0,0); return; }
  const l = fg.linhas[mes-1];
  if(!l){ panel.innerHTML = ''; return; }
  const margemMes = l.creditosTotal > 0 ? (l.saldoMes / l.creditosTotal * 100) : 0;
  panel.innerHTML = monthPanelHTML(mes, l.creditosTotal, l.jurosMes, l.debitoMes, l.saldoMes, l.saldoAcum, margemMes);
}

  return `
   <div class="kpi-grid" style="margin-top:14px;">
     <div class="kpi"><div class="bar"></div><div class="label">Período</div><div class="val">M${de} → M${ate}</div></div>

     <div class="kpi ${saldoAcumFinal>=0?'pos':'neg'}"><div class="bar"></div><div class="label">Saldo Acumulado em M${ate}</div><div class="val">${spanMoney(saldoAcumFinal)}</div></div>
